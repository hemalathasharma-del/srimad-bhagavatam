<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bhāgavatam Stories · Canto 1 · King Parīkṣit and the Seven Days</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Lora:ital,wght@0,500;1,500&family=Noto+Sans+Devanagari:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* Palette and fonts follow Krishna's Life Compass */
:root{--bg:#fffaf2;--surface:#fff;--surface-2:#fdf3e4;--ink:#2b2733;--ink-soft:#5b5566;--line:#ecdfcc;--saffron:#f6b04d;--saffron-ink:#8a4a00;--lavender:#e4d8f7;--lavender-ink:#5b3f8c;--sage:#dbe8d5;--sage-ink:#2f5d34;--peach:#ffe1cc;--sky:#dcecfa;--sky-ink:#1f4f7a;--focus:#5b3f8c}
@media (prefers-color-scheme:dark){:root{--bg:#1b1820;--surface:#24202b;--surface-2:#2c2734;--ink:#f4efe8;--ink-soft:#c9c1d3;--line:#3d3647;--saffron-ink:#ffc978;--lavender:#3a2f52;--lavender-ink:#d8c7fa;--sage:#2b3a2b;--sage-ink:#b9dcb7;--peach:#43302a;--sky:#23364a;--sky-ink:#b4d7f7;--focus:#d8c7fa}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Nunito','Noto Sans Devanagari',system-ui,sans-serif;line-height:1.6;-webkit-text-size-adjust:100%}
html[lang=hi] body{font-family:'Noto Sans Devanagari','Nunito',sans-serif}
.serif{font-family:'Lora','Noto Sans Devanagari',Georgia,serif}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding:12px 16px 48px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 14px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px}
.brand svg{width:34px;height:22px;color:var(--saffron-ink)}
.pill{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:800;font-size:14px;cursor:pointer}
.space>*+*{margin-top:22px}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:24px;background:linear-gradient(135deg,var(--peach),var(--surface) 55%,var(--lavender))}
.hero .feather{position:absolute;right:-6px;top:-6px;width:70px;height:140px;transform:rotate(12deg);color:var(--sage-ink);opacity:.6;pointer-events:none}
.hero .lotus{width:60px;height:38px;color:var(--saffron-ink)}
.hero h1{font-size:34px;line-height:1.1;font-weight:800;letter-spacing:-.01em;margin-top:8px;max-width:90%}
.hero .tag{font-size:19px;color:var(--ink-soft);margin-top:6px}
.hero .by{font-size:13px;font-weight:700;color:var(--ink-soft);margin-top:4px}
.hero .lead{font-size:16.5px;margin-top:12px;max-width:34em}
.hero .flute{width:150px;height:16px;color:var(--saffron-ink);opacity:.7;margin-top:16px}
h2.sec{font-size:19px;font-weight:800;margin-bottom:10px}
.ages{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.age{min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:800;cursor:pointer;padding:8px 4px}
.age span{font-size:28px;line-height:1.1}
.age small{font-weight:600;color:var(--ink-soft);font-size:12px}
.age[aria-checked=true]{border-color:var(--lavender-ink);background:var(--lavender)}
.cantobar{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.cantobar::-webkit-scrollbar{height:4px}.cantobar::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}
.cb{flex:none;scroll-snap-align:start;min-width:92px;max-width:120px;min-height:76px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer;padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:2px}
.cb .num{font-size:22px;font-weight:800;line-height:1;color:var(--sky-ink)}
.cb .nm{font-size:12px;font-weight:700;line-height:1.25;color:var(--ink-soft);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cb .dotlive{font-size:10.5px;font-weight:800;color:var(--sage-ink)}
.cb[aria-checked=true]{border-color:var(--saffron);background:var(--peach)}
.cb[aria-checked=true] .num{color:var(--saffron-ink)}
.soonbox{margin-top:14px;border:2px dashed var(--line);border-radius:16px;padding:16px;text-align:center;font-weight:700;color:var(--ink-soft)}
.ep.soon-row{opacity:.85}
.summary{background:var(--surface-2);border:2px solid var(--line)}
.summary .chip{margin-bottom:6px}
.summary h2{font-size:22px;font-weight:800;margin-bottom:6px}
.summary p{font-size:15.5px;margin-bottom:8px}
.summary .themes{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.summary .themes span{font-size:13px;font-weight:700;background:var(--lavender);color:var(--lavender-ink);border-radius:999px;padding:3px 10px}
.vid{margin-top:14px}
.vid h3{font-size:17px;font-weight:800;margin-bottom:8px}
.vid #sumSlide{width:100%;max-width:340px;margin:0 auto;box-shadow:0 10px 30px rgba(8,33,79,.18)}
.vcap{max-width:340px;margin:10px auto 0;font-size:14.5px;line-height:1.5;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.ep-head{font-size:14px;font-weight:800;color:var(--sky-ink);margin:0 4px 10px}
.ep-head b{display:block;font-size:19px;color:var(--ink)}
.ep-btn{width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.ep-btn:hover{border-color:var(--saffron)}
.ep .thumb{flex:none;width:64px;height:48px;border-radius:10px;overflow:hidden}
.ep .thumb svg{width:100%;height:100%;display:block}
.ep .play{margin-left:auto;flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--saffron);color:#3a2400;font-weight:800}
.next-ep .btn{margin-top:10px}
.eps{list-style:none;display:grid;gap:10px}
.ep{display:flex;gap:12px;align-items:center;border-radius:16px;border:2px solid var(--line);background:var(--surface);padding:12px}
.ep .n{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--sky);color:var(--sky-ink)}
.ep b{display:block;font-size:15.5px;line-height:1.3}
.ep small{color:var(--ink-soft);font-size:12.5px}
.ep .soon{margin-left:auto;flex:none;font-size:11.5px;font-weight:800;color:var(--ink-soft);background:var(--surface-2);border-radius:999px;padding:3px 9px}
.ep-live{border-color:var(--saffron);display:block}
.ep-live .row1{display:flex;gap:12px;align-items:center}
.ep-live .n{background:var(--saffron);color:#3a2400}
.ep-live .soon{background:var(--sage);color:var(--sage-ink)}
.story-card{border-radius:20px;border:2px solid var(--line);background:var(--surface);padding:14px}
.chip{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.04em;color:var(--sky-ink);background:var(--sky);border-radius:999px;padding:3px 10px}
.story-card h3{font-size:21px;font-weight:800;margin:8px 0 2px;line-height:1.25}
.story-card .ref{font-size:13px;color:var(--ink-soft)}
.story-card .cover{margin:12px 0;border-radius:16px;overflow:hidden;aspect-ratio:4/3}
.story-card .cover svg{width:100%;height:100%;display:block}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border:0;border-radius:16px;background:var(--saffron);color:#3a2400;font:inherit;font-weight:800;font-size:17px;cursor:pointer}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:2px solid var(--line)}
.meta{font-size:13px;color:var(--ink-soft);text-align:center;margin-top:8px}
.voice-status{font-size:13px;border-radius:12px;padding:8px 12px;margin-top:10px;background:var(--sage);color:var(--sage-ink);font-weight:700}
.voice-status.warn{background:#fff0f0;color:#a1131b}
@media (prefers-color-scheme:dark){.voice-status.warn{background:#3b1c20;color:#ffb3b7}}

/* Krishna Blue story deck (from Life Compass card theme) */
.deck{border-radius:24px;padding:12px;color:#f4f7ff;background:radial-gradient(110% 70% at 80% 5%,rgba(80,160,255,.45) 0%,transparent 55%),radial-gradient(90% 60% at 10% 95%,rgba(255,211,77,.22) 0%,transparent 60%),linear-gradient(170deg,#123c8c 0%,#08214f 75%);box-shadow:0 10px 30px rgba(8,33,79,.25)}
.stage{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:4/3;background:#08214f}
.stage svg{width:100%;height:100%;display:block}
.scene-num{position:absolute;top:8px;left:10px;background:rgba(8,33,79,.6);padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#ffd34d}
.cap{padding:14px 6px 4px}
.cap h3{font-size:21px;color:#ffd34d;margin-bottom:6px;text-shadow:0 0 20px rgba(255,211,77,.5)}
.cap p{font-size:16.5px;line-height:1.7;color:#e8eefc}
.cap .s{transition:background .3s,color .3s;border-radius:4px}
.cap .s.on{background:rgba(255,211,77,.18);color:#fff}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25);border:0;cursor:pointer;transition:all .3s}
.dot.on{background:#ffd34d;width:22px;border-radius:5px}
.dot.done{background:rgba(255,211,77,.55)}
.ctrls{display:flex;gap:12px;justify-content:center;align-items:center;padding-bottom:4px}
.ic{width:50px;height:50px;border-radius:50%;border:1px solid rgba(255,211,77,.35);background:rgba(255,255,255,.1);color:#ffe38a;font-size:20px;cursor:pointer}
.ic.main{width:64px;height:64px;background:#ffd34d;color:#0b2a6b;border:0;font-size:24px;box-shadow:0 0 20px rgba(255,211,77,.6)}
.toggles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.tg{min-height:40px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink-soft);padding:0 14px;font:inherit;font-weight:700;font-size:13.5px;cursor:pointer}
.tg.on{border-color:var(--saffron);color:var(--saffron-ink);background:var(--surface-2)}
.tap-voice{display:none;margin-top:10px}

/* End */
.card{border-radius:20px;padding:18px}
.lessons{background:var(--sage)}
.lessons h2{color:var(--sage-ink)}
.lessons ul{list-style:none}
.lessons li{position:relative;padding:6px 0 6px 30px}
.lessons li:before{content:'🪷';position:absolute;left:0;top:6px;font-size:16px}
.cross{display:flex;gap:14px;align-items:center;border:2px solid var(--saffron);background:var(--peach);color:var(--ink);text-decoration:none}
.cross .e{font-size:42px}
.cross b{display:block;font-size:17px}
.cross span{font-size:14px;color:var(--ink-soft)}
.quiz{background:var(--surface);border:2px solid var(--line)}
.qcount{color:var(--ink-soft);font-size:13px;margin-bottom:8px}
.qtext{font-size:17px;font-weight:800;margin-bottom:12px;line-height:1.4}
.opt{display:block;width:100%;text-align:left;margin-bottom:8px;padding:12px 14px;min-height:48px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:15px;cursor:pointer}
.opt.right{border-color:#2f8a4b;background:var(--sage)}
.opt.wrong{border-color:#c0392b;background:#fff0f0;color:#7a1218}
.explain{font-size:14.5px;color:var(--ink-soft);margin:6px 0 12px}
.score{text-align:center;padding:8px}
.score b{display:block;font-size:40px;color:var(--saffron-ink)}
.next-ep{background:var(--lavender);color:var(--ink)}
.next-ep b{color:var(--lavender-ink)}
.fade{animation:fade .5s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* scene animations */
.scene-in{animation:sceneIn 1.1s ease both}
@keyframes sceneIn{from{opacity:0;transform:scale(1.05)}to{opacity:1;transform:scale(1)}}
.kenburns{animation:kb 22s ease-in-out infinite alternate;transform-origin:50% 60%}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.08) translate(-6px,-4px)}}
.twinkle{animation:tw 3s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.pulse{animation:pu 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:.9;transform:scale(1.12)}}
.float{animation:fl 4s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.sway{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.flow{animation:flw 6s linear infinite}@keyframes flw{from{transform:translateX(0)}to{transform:translateX(-80px)}}
.tear{animation:tr 2s ease-in infinite}@keyframes tr{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(18px);opacity:0}}
.bounce-off{animation:bo 2.4s ease-out infinite}@keyframes bo{0%{transform:translate(0,0);opacity:1}100%{transform:translate(60px,-50px);opacity:0}}
.bounce-off2{animation:bo2 2.4s ease-out infinite .8s}@keyframes bo2{0%{transform:translate(0,0);opacity:1}100%{transform:translate(-60px,-40px);opacity:0}}
.walk{animation:wk 7s ease-out both}@keyframes wk{from{transform:translateX(120px);opacity:0}to{transform:translateX(0);opacity:1}}
.rays{animation:ry 12s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes ry{to{transform:rotate(360deg)}}
.breathe{animation:br 4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}@keyframes br{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.02)}}
.glowred{animation:gr 1.6s ease-in-out infinite}@keyframes gr{0%,100%{opacity:.3}50%{opacity:.8}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><svg viewBox="0 0 64 40" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M32 6c6 7 8 16 0 30-8-14-6-23 0-30Z"/><path d="M32 36c-4-9-11-16-22-18 2 10 10 17 22 18Z"/><path d="M32 36c4-9 11-16 22-18-2 10-10 17-22 18Z"/></g></svg><span data-t="brand"></span></div>
    <button class="pill" id="lang" type="button"></button>
  </div>

  <main id="home" class="space">
    <section class="hero">
      <svg class="feather" viewBox="0 0 40 80" aria-hidden="true"><path d="M20 78C19 50 18 28 20 4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M20 8C6 22 6 46 20 60 34 46 34 22 20 8Z" fill="currentColor" opacity=".18"/><ellipse cx="20" cy="30" rx="7" ry="9" fill="#1f6f8b" opacity=".75"/><ellipse cx="20" cy="30" rx="3.5" ry="5" fill="#2b3a8c"/><circle cx="20" cy="30" r="1.8" fill="#c99a2e"/></svg>
      <svg class="lotus" viewBox="0 0 64 40" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M32 6c6 7 8 16 0 30-8-14-6-23 0-30Z"/><path d="M32 36c-4-9-11-16-22-18 2 10 10 17 22 18Z"/><path d="M32 36c4-9 11-16 22-18-2 10-10 17-22 18Z"/><path d="M32 36C24 31 12 30 4 32c8 5 18 6 28 4Z"/><path d="M32 36c8-5 20-6 28-4-8 5-18 6-28 4Z"/></g></svg>
      <h1 data-t="brand"></h1>
      <p class="tag serif" data-t="tagline"></p>
      <p class="by"><span aria-hidden="true">🙏 </span><span data-t="by"></span></p>
      <p class="lead" data-t="lead"></p>
      <svg class="flute" viewBox="0 0 120 16" aria-hidden="true"><rect x="2" y="5" width="116" height="6" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/><g fill="currentColor"><circle cx="30" cy="8" r="1.4"/><circle cx="44" cy="8" r="1.4"/><circle cx="56" cy="8" r="1.4"/><circle cx="68" cy="8" r="1.4"/><circle cx="80" cy="8" r="1.4"/><circle cx="92" cy="8" r="1.4"/></g></svg>
    </section>


    <section>
      <h2 class="sec" id="pickH" data-t="pickCanto"></h2>
      <div class="cantobar" id="cantoBar" role="radiogroup" aria-labelledby="pickH"></div>
    </section>

    <section class="card summary">
      <span class="chip" id="cantoTagEl"></span>
      <h2 id="cantoNameEl"></h2>
      <div id="sumText"></div>
      <div class="themes" id="themes"></div>
      <div class="soonbox" id="vidSoon" hidden>🎬 <span data-t="vidSoon"></span></div>
      <div class="vid" id="vidBox">
        <h3>🎬 <span data-t="vidTitle"></span></h3>
        <!-- In-page slideshow player -->
        <div id="sumSlide" style="position:relative;width:100%;height:380px;background:var(--surface-2);border-radius:18px;overflow:hidden;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:rgba(0,0,0,0.1)" aria-label="Play summary">
          <div id="sumArt" style="width:100%;-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;padding:16px"></div>
          <div id="sumCap" style="width:100%;padding:12px 16px 10px;background:linear-gradient(0deg,var(--surface) 80%,transparent);font-size:14.5px;line-height:1.5;min-height:80px;text-align:center"></div>
          <div id="sumProg" style="position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--saffron);width:0%;-webkit-transition:width .3s linear;transition:width .3s linear"></div>
          <button id="sumOverlay" type="button" style="position:absolute;top:0;left:0;right:0;bottom:0;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;background:linear-gradient(135deg,var(--peach),var(--surface-2) 55%,var(--lavender));gap:10px;border:none;cursor:pointer;width:100%;-webkit-tap-highlight-color:rgba(0,0,0,0.1)" aria-label="Play summary">
            <svg width="72" height="72" viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="32" fill="var(--saffron)" opacity=".25"/><polygon points="26,20 50,32 26,44" fill="var(--saffron-ink)"/></svg>
            <div style="font-weight:800;font-size:16px;color:var(--ink-soft);text-align:center;padding:0 20px" data-t="vidTitle"></div>
            <div style="font-size:13px;color:var(--ink-soft)">▶ Tap to play</div>
          </button>
        </div>
        <div class="toggles" id="sumToggles" hidden>
          <button class="tg on" id="tVidNarr" type="button">🔊 <span data-t="vidNarr"></span></button>
        </div>
        <div class="voice-status warn" id="vnstatus" hidden></div>
      </div>
    </section>

    <section>
      <h2 class="sec" data-t="episodes"></h2>
      <ol class="eps" id="eps"></ol>
      <div class="voice-status" id="vstatus" hidden></div>
    </section>
  </main>

  <main id="player" hidden>
    <div class="ep-head" id="epHead"></div>
    <div class="deck">
      <div class="stage" id="stage"></div>
      <div class="cap" id="cap" aria-live="polite"></div>
      <div class="dots" id="dots"></div>
      <div class="ctrls">
        <button class="ic" id="prev" type="button" aria-label="Previous">⏮</button>
        <button class="ic main" id="play" type="button" aria-label="Play or pause">⏸</button>
        <button class="ic" id="next" type="button" aria-label="Next">⏭</button>
      </div>
    </div>
    <button class="btn tap-voice" id="tapVoice" type="button">🔊 <span data-t="tapHear"></span></button>
    <div class="voice-status warn" id="pstatus" hidden></div>
    <div class="toggles">
      <button class="tg on" id="tVoice" type="button">🔊 <span data-t="narration"></span></button>
      <button class="tg" id="tMusic" type="button">🎵 <span data-t="drone"></span></button>
      <button class="tg on" id="tAuto" type="button">⏩ <span data-t="autoNext"></span></button>
      <button class="tg" id="home2" type="button">🏠 <span data-t="home"></span></button>
    </div>
  </main>

  <main id="end" class="space" hidden>
    <section class="card lessons"><h2 class="sec" data-t="learn"></h2><ul id="lessons"></ul></section>
    <a class="card cross" id="crossCard" href="https://krishnas-life-compass.vercel.app/feel" target="_blank" rel="noopener noreferrer">
      <span class="e" aria-hidden="true">🧭</span>
      <span><b id="crossT"></b><span id="crossS"></span></span>
    </a>
    <section class="card quiz" id="quiz"></section>
    <button class="btn ghost" id="replay" type="button">↺ <span data-t="again"></span></button>
    <section class="card next-ep" id="nextEp"></section>
  </main>
</div>

<script>

let uid=0;
function sky(top,bottom){const id='g'+(++uid);return {def:`<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${top}"/><stop offset="1" stop-color="${bottom}"/></linearGradient>`,fill:`url(#${id})`};}
function stars(n,maxY=150){let s='';for(let i=0;i<n;i++){const x=(i*73+17)%400,y=(i*41+11)%maxY,r=(i%3)*0.5+0.6;s+=`<circle class="twinkle" style="animation-delay:${(i%7)*0.4}s" cx="${x}" cy="${y}" r="${r}" fill="#fff"/>`;}return s;}
function tree(x,y,s=1,c='#1f5d3a'){return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-4" y="-30" width="8" height="30" fill="#4a2f1b"/><g class="sway"><circle cx="0" cy="-44" r="22" fill="${c}"/><circle cx="-14" cy="-34" r="14" fill="${c}"/><circle cx="14" cy="-34" r="14" fill="${c}"/></g></g>`;}
function person(x,y,s,o={}){
  const skin=o.skin||'#e3a978', cloth=o.cloth||'#c0392b', sit=o.sit;
  const hy=sit?-46:-62; let g='';
  if(o.halo) g+=`<circle class="pulse" cx="0" cy="${hy}" r="20" fill="${o.halo}" opacity=".5"/>`;
  if(sit){
    g+=`<ellipse cx="0" cy="-6" rx="24" ry="8" fill="${cloth}" opacity=".9"/>`;
    g+=`<path d="M-12,${hy+11} L12,${hy+11} L15,-8 L-15,-8 Z" fill="${cloth}"/>`;
  } else {
    g+=`<path d="M-11,${hy+11} L11,${hy+11} L18,0 L-18,0 Z" fill="${cloth}"/>`;
  }
  // arms
  const sh=hy+15, L=[-10,sh], R=[10,sh];
  const arm=(a,b)=>`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${skin}" stroke-width="5" stroke-linecap="round"/>`;
  const a=o.arm||'down';
  if(a==='down'){g+=arm(L,[-16,sh+22])+arm(R,[16,sh+22]);}
  if(a==='fold'){g+=arm(L,[-2,sh+10])+arm(R,[2,sh+10]);}
  if(a==='lap'){g+=arm(L,[-8,sh+24])+arm(R,[8,sh+24]);}
  if(a==='up'){g+=arm(L,[-16,sh+22])+arm(R,[24,sh-18]);}
  if(a==='point'){g+=arm(L,[-16,sh+22])+arm(R,[30,sh+2]);}

  if(a==='bow'){g+=arm(L,[-26,sh+2])+arm(R,[4,sh+4])+`<path d="M-26,${sh-22} Q-40,${sh+2} -26,${sh+26}" fill="none" stroke="#8b5a2b" stroke-width="2.5"/><line x1="-26" y1="${sh-22}" x2="-26" y2="${sh+26}" stroke="#ddd" stroke-width=".8"/>`;}
  if(a==='stick'){g+=arm(L,[-16,sh+22])+arm(R,[20,sh-8])+`<line x1="14" y1="${sh+20}" x2="30" y2="${sh-26}" stroke="#3b2414" stroke-width="3.5"/>`;}
  // head
  g+=`<circle cx="0" cy="${hy}" r="10" fill="${skin}"/>`;

  if(o.beard) g+=`<path d="M-8,${hy+3} Q0,${hy+24} 8,${hy+3} Z" fill="${o.beard}"/>`;
  if(o.crown) g+=`<path d="M-9,${hy-8} L-9,${hy-18} L-4,${hy-13} L0,${hy-21} L4,${hy-13} L9,${hy-18} L9,${hy-8} Z" fill="${o.crown}"/>`;
  if(o.tilak) g+=`<line x1="0" y1="${hy-6}" x2="0" y2="${hy-1}" stroke="#fff" stroke-width="1.2"/>`;
  if(o.eyesClosed) g+=`<path d="M-5,${hy} q2,2 4,0 M1,${hy} q2,2 4,0" stroke="#3a2412" stroke-width="1" fill="none"/>`;

  if(o.mala) g+=`<path d="M-7,${hy+12} Q0,${hy+26} 7,${hy+12}" fill="none" stroke="#f6e7b0" stroke-width="1.6" stroke-dasharray="1.5 1.5"/>`;
  const cls=o.cls?` class="${o.cls}"`:'';
  return `<g transform="translate(${x} ${y}) scale(${s}) ${o.flip?'scale(-1 1)':''}"${cls}>${g}</g>`;
}

en:{sum:["Canto 1 sets the stage for the whole Bhāgavatam. In the Naimiṣāraṇya forest, thousands of sages ask Sūta Gosvāmī what is truly best for people in the age of Kali. Sūta tells how Vyāsadeva, guided by Nārada, wrote the Bhāgavatam.","He then describes the days after the Kurukṣetra war: Krishna saves the unborn Parīkṣit, Queen Kuntī and Bhīṣma glorify Him, He returns to Dvārakā, and finally leaves this world. As the age of Kali begins, King Parīkṣit holds Kali back, is cursed to die in seven days, and asks Śukadeva what a person should do before death. The rest of the Bhāgavatam is the answer."],
 themes:["Bhakti is the highest dharma","The Lord protects His devotees","Hearing about the Lord","Facing death with faith"]},
hi:{sum:["प्रथम स्कंध पूरे भागवत की नींव रखता है। नैमिषारण्य वन में हज़ारों ऋषि सूत गोस्वामी से पूछते हैं कि कलियुग में लोगों के लिए सबसे उत्तम क्या है। सूत जी बताते हैं कि नारद जी के मार्गदर्शन में व्यासदेव ने भागवत की रचना कैसे की।","फिर वे कुरुक्षेत्र युद्ध के बाद की घटनाएँ सुनाते हैं: श्रीकृष्ण गर्भ में परीक्षित की रक्षा करते हैं, रानी कुंती और भीष्म उनकी स्तुति करते हैं, वे द्वारका लौटते हैं, और अंत में इस संसार से प्रस्थान करते हैं। कलियुग के आरंभ में राजा परीक्षित कलि को रोकते हैं, सात दिन में मृत्यु का श्राप पाते हैं, और शुकदेव जी से पूछते हैं कि मृत्यु से पहले मनुष्य को क्या करना चाहिए। शेष भागवत उसी प्रश्न का उत्तर है।"],
 themes:["भक्ति ही सर्वोच्च धर्म है","भगवान भक्तों की रक्षा करते हैं","भगवान की कथा का श्रवण","विश्वास के साथ मृत्यु का सामना"]}
};

const CANTOS=[
{n:1,en:"Creation",hi:"सृष्टि",chapters:19},
{n:2,en:"The Cosmic Manifestation",hi:"ब्रह्मांड की अभिव्यक्ति",chapters:10,
 sum:{en:["Śukadeva begins to answer King Parīkṣit's question: how should a person prepare for death? He explains how to fix the mind on the Lord, first by meditating on His universal form, in which the whole cosmos is His body.","He then describes how Lord Brahmā was created and received the Bhāgavatam in four core verses directly from the Lord. The canto ends with the ten subjects the Bhāgavatam covers."],
      hi:["शुकदेव जी राजा परीक्षित के प्रश्न का उत्तर देना आरंभ करते हैं: मृत्यु की तैयारी कैसे करें? वे बताते हैं कि मन को भगवान में कैसे लगाएँ, पहले उनके विराट रूप का ध्यान करके, जिसमें पूरा ब्रह्मांड उनका शरीर है।","फिर वे बताते हैं कि ब्रह्मा जी कैसे प्रकट हुए और उन्होंने भगवान से सीधे चार मूल श्लोकों में भागवत पाई। स्कंध भागवत के दस विषयों के वर्णन के साथ समाप्त होता है।"]},
 themes:{en:["Preparing for the end","The universal form","The four core verses"],hi:["अंत की तैयारी","विराट रूप","चतुःश्लोकी भागवत"]},
 eps:[["2.1–2","The Universal Form of the Lord","भगवान का विराट रूप"],["2.9","The Four Core Verses (Catuḥ-ślokī)","चार मूल श्लोक (चतुःश्लोकी)"]]},
{n:3,en:"The Status Quo",hi:"यथास्थिति",chapters:33,
 sum:{en:["Vidura meets Uddhava and then the sage Maitreya, who explains how the Lord creates the universe. We hear how the four Kumāras cursed the gatekeepers Jaya and Vijaya, who were born as the demons Hiraṇyākṣa and Hiraṇyakaśipu.","Lord Varāha lifts the earth from the ocean and defeats Hiraṇyākṣa. Then the sage Kardama marries Devahūti, and their son, Lord Kapila, teaches His mother the path of devotion."],
      hi:["विदुर जी उद्धव से और फिर मैत्रेय ऋषि से मिलते हैं, जो बताते हैं कि भगवान सृष्टि कैसे करते हैं। हम सुनते हैं कि चारों कुमारों ने द्वारपाल जय और विजय को श्राप दिया, जो हिरण्याक्ष और हिरण्यकशिपु के रूप में जन्मे।","भगवान वराह पृथ्वी को समुद्र से उठाते हैं और हिरण्याक्ष को हराते हैं। फिर कर्दम ऋषि देवहूति से विवाह करते हैं, और उनके पुत्र भगवान कपिल अपनी माता को भक्ति का मार्ग सिखाते हैं।"]},
 themes:{en:["How creation works","Lord Varāha","Kapila's teachings"],hi:["सृष्टि कैसे होती है","भगवान वराह","कपिल जी के उपदेश"]},
 eps:[["3.15–16","The Kumāras Curse Jaya and Vijaya","कुमारों ने जय-विजय को श्राप दिया"],["3.17–19","Lord Varāha Saves the Earth","भगवान वराह ने पृथ्वी को बचाया"],["3.25–33","Lord Kapila Teaches His Mother","भगवान कपिल ने माता को उपदेश दिया"]]},
{n:4,en:"The Creation of the Fourth Order",hi:"चतुर्थ सृष्टि",chapters:31,
 sum:{en:["Dakṣa insults Lord Śiva, and Satī gives up her body at his sacrifice. The five-year-old prince Dhruva, hurt by his stepmother's words, does intense austerities and is rewarded by the Lord with the Pole Star.","The wicked King Vena is removed, and from his body comes King Pṛthu, an ideal ruler who milks the earth for all beings. The canto ends with Nārada's story of King Purañjana, a picture of the soul trapped in the body."],
      hi:["दक्ष भगवान शिव का अपमान करते हैं, और सती उनके यज्ञ में देह त्याग देती हैं। सौतेली माँ के वचनों से आहत पाँच वर्ष के राजकुमार ध्रुव कठोर तप करते हैं, और भगवान उन्हें ध्रुव तारा प्रदान करते हैं।","दुष्ट राजा वेन को हटाया जाता है, और उसके शरीर से राजा पृथु प्रकट होते हैं, जो आदर्श शासक हैं और सबके लिए पृथ्वी का दोहन करते हैं। स्कंध नारद जी की राजा पुरंजन की कथा के साथ समाप्त होता है, जो शरीर में बंधी आत्मा का चित्र है।"]},
 themes:{en:["Determination","Respect for devotees","The ideal king"],hi:["दृढ़ संकल्प","भक्तों का सम्मान","आदर्श राजा"]},
 eps:[["4.2–7","Dakṣa's Sacrifice and Satī","दक्ष का यज्ञ और सती"],["4.8–12","The Determination of Prince Dhruva","राजकुमार ध्रुव का संकल्प"],["4.13–23","King Vena and King Pṛthu","राजा वेन और राजा पृथु"],["4.25–29","The Allegory of King Purañjana","राजा पुरंजन का रूपक"]]},
{n:5,en:"The Creative Impetus",hi:"सृष्टि की प्रेरणा",chapters:26,
 sum:{en:["Lord Ṛṣabhadeva teaches his sons that human life is for spiritual progress, not just for pleasure. King Bharata becomes attached to a baby deer, is born as a deer, and then as the silent sage Jaḍa Bharata, who teaches King Rahūgaṇa.","The canto then describes the structure of the universe: the islands, oceans, planets and the hellish regions."],
      hi:["भगवान ऋषभदेव अपने पुत्रों को सिखाते हैं कि मानव जीवन केवल सुख के लिए नहीं, आध्यात्मिक उन्नति के लिए है। राजा भरत एक हिरण के बच्चे में आसक्त होकर हिरण बनते हैं, और फिर मौन ऋषि जड़ भरत बनकर राजा रहूगण को उपदेश देते हैं।","फिर यह स्कंध ब्रह्मांड की रचना का वर्णन करता है: द्वीप, समुद्र, ग्रह और नरक लोक।"]},
 themes:{en:["The purpose of human life","Attachment","The shape of the universe"],hi:["मानव जीवन का उद्देश्य","आसक्ति","ब्रह्मांड की रचना"]},
 eps:[["5.4–6","The Teachings of Lord Ṛṣabhadeva","भगवान ऋषभदेव के उपदेश"],["5.7–14","The Three Lives of King Bharata","राजा भरत के तीन जन्म"]]},
{n:6,en:"Prescribed Duties for Mankind",hi:"मानव के कर्तव्य",chapters:19,
 sum:{en:["Ajāmila, who had lived a sinful life, is saved at death simply by calling out the name Nārāyaṇa. This shows the power of the Lord's holy name.","Later the demon Vṛtrāsura fights Indra, yet he is a great devotee who prays to serve the Lord. The canto also tells of King Citraketu and the protective prayer Nārāyaṇa-kavaca."],
      hi:["पापमय जीवन जीने वाले अजामिल मृत्यु के समय केवल नारायण नाम पुकारने से बच जाते हैं। यह भगवान के पवित्र नाम की शक्ति दिखाता है।","आगे असुर वृत्रासुर इंद्र से युद्ध करता है, फिर भी वह महान भक्त है जो भगवान की सेवा की प्रार्थना करता है। इस स्कंध में राजा चित्रकेतु और रक्षा कवच नारायण-कवच की कथा भी है।"]},
 themes:{en:["The power of the holy name","Devotion in any situation"],hi:["पवित्र नाम की शक्ति","हर स्थिति में भक्ति"]},
 eps:[["6.1–3","Ajāmila Saved by the Holy Name","पवित्र नाम से अजामिल का उद्धार"],["6.11–13","The Battle of Vṛtrāsura","वृत्रासुर का युद्ध"]]},
{n:7,en:"The Science of God",hi:"भगवद्-विज्ञान",chapters:15,
 sum:{en:["The demon king Hiraṇyakaśipu hates Lord Viṣṇu, but his little son Prahlāda is a pure devotee who teaches his schoolfriends about God. His father tries again and again to kill him, but the Lord protects him every time.","At last the Lord appears from a pillar as Nṛsiṁha, half man and half lion, and destroys Hiraṇyakaśipu. Prahlāda offers beautiful prayers. Nārada then explains the duties of the different stages of life."],
      hi:["असुर राजा हिरण्यकशिपु भगवान विष्णु से द्वेष करता है, पर उसका छोटा पुत्र प्रह्लाद शुद्ध भक्त है जो अपने सहपाठियों को भगवान के बारे में सिखाता है। पिता बार-बार उसे मारने का प्रयास करता है, पर भगवान हर बार उसकी रक्षा करते हैं।","आख़िरकार भगवान खंभे से आधे मनुष्य, आधे सिंह नृसिंह रूप में प्रकट होते हैं और हिरण्यकशिपु का अंत करते हैं। प्रह्लाद सुंदर स्तुति करते हैं। फिर नारद जी जीवन के विभिन्न आश्रमों के कर्तव्य बताते हैं।"]},
 themes:{en:["Faith of a child","The Lord protects","Fearlessness"],hi:["बालक की आस्था","भगवान रक्षा करते हैं","निर्भयता"]},
 eps:[["7.1–10","Prahlāda and Lord Nṛsiṁha","प्रह्लाद और भगवान नृसिंह"]]},
{n:8,en:"Withdrawal of the Cosmic Creations",hi:"ब्रह्मांडीय सृष्टि का संहार",chapters:24,
 sum:{en:["Gajendra the elephant, caught by a crocodile, calls on the Lord and is saved. The demigods and demons churn the ocean of milk; Lord Śiva drinks the poison, and the Lord as Mohinī gives the nectar to the demigods.","Lord Vāmana, a dwarf brāhmaṇa, asks King Bali for three steps of land and covers the universe. The canto ends with the Matsya avatāra saving the Vedas in the great flood."],
      hi:["मगरमच्छ के पकड़ में आया हाथी गजेंद्र भगवान को पुकारता है और बच जाता है। देवता और असुर क्षीरसागर का मंथन करते हैं; भगवान शिव विष पीते हैं, और भगवान मोहिनी रूप में देवताओं को अमृत देते हैं।","बौने ब्राह्मण भगवान वामन राजा बलि से तीन पग भूमि माँगते हैं और पूरा ब्रह्मांड नाप लेते हैं। स्कंध महाप्रलय में वेदों की रक्षा करने वाले मत्स्य अवतार के साथ समाप्त होता है।"]},
 themes:{en:["Calling on God","Sacrifice for others","Surrender"],hi:["भगवान को पुकारना","दूसरों के लिए त्याग","समर्पण"]},
 eps:[["8.2–4","Gajendra Saved from the Crocodile","मगरमच्छ से गजेंद्र की रक्षा"],["8.7–12","The Churning of the Milk Ocean","क्षीरसागर मंथन"],["8.18–23","Lord Vāmana and King Bali","भगवान वामन और राजा बलि"]]},
{n:9,en:"Liberation",hi:"मुक्ति",chapters:24,
 sum:{en:["This canto tells the history of the sun and moon dynasties. King Ambarīṣa is protected from the sage Durvāsā by the Lord's Sudarśana disc, and Bhagīratha brings the Gaṅgā down to earth.","At its heart are the pastimes of Lord Rāmacandra: His exile, the rescue of Sītā and His ideal rule. It ends with the family into which Lord Krishna appears."],
      hi:["यह स्कंध सूर्य और चंद्र वंशों का इतिहास बताता है। राजा अंबरीष की रक्षा भगवान का सुदर्शन चक्र दुर्वासा ऋषि से करता है, और भगीरथ गंगा को पृथ्वी पर लाते हैं।","इसके केंद्र में भगवान रामचंद्र की लीलाएँ हैं: उनका वनवास, सीता जी को छुड़ाना और उनका आदर्श राज्य। स्कंध उस वंश के साथ समाप्त होता है जिसमें भगवान श्रीकृष्ण प्रकट होते हैं।"]},
 themes:{en:["Ideal kings","Lord Rāma","Devotees are protected"],hi:["आदर्श राजा","भगवान राम","भक्तों की रक्षा"]},
 eps:[["9.10–11","The Pastimes of Lord Rāmacandra","भगवान रामचंद्र की लीलाएँ"]]},
{n:10,en:"The Summum Bonum",hi:"परम सत्य",chapters:90,
 sum:{en:["The longest and most loved canto describes Lord Krishna's life: His birth in Kaṁsa's prison, His childhood in Vṛndāvana with Yaśodā and the cowherd friends, the demons He defeats and Govardhana Hill He lifts.","He then goes to Mathurā, ends Kaṁsa's rule, builds Dvārakā, marries Rukmiṇī and welcomes His poor friend Sudāmā."],
      hi:["सबसे लंबा और सबसे प्रिय स्कंध भगवान श्रीकृष्ण के जीवन का वर्णन करता है: कंस के कारागार में जन्म, वृंदावन में यशोदा माँ और ग्वाल-बालों के साथ बचपन, असुरों का अंत और गोवर्धन पर्वत उठाना।","फिर वे मथुरा जाकर कंस का अंत करते हैं, द्वारका बसाते हैं, रुक्मिणी से विवाह करते हैं और अपने निर्धन मित्र सुदामा का स्वागत करते हैं।"]},
 themes:{en:["Krishna's childhood","Love of Vṛndāvana","Friendship"],hi:["श्रीकृष्ण का बचपन","वृंदावन का प्रेम","मित्रता"]},
 eps:[["10.1–14","The Advent and Childhood of Lord Krishna","श्रीकृष्ण का प्राकट्य और बचपन"],["10.24–27","The Lifting of Govardhana Hill","गोवर्धन पर्वत उठाना"]]},
{n:11,en:"General History",hi:"सामान्य इतिहास",chapters:31,
 sum:{en:["Before leaving the world, Krishna gives His dear friend Uddhava His final teachings, known as the Uddhava Gītā. It includes the story of a wandering sage who learned from twenty-four teachers in nature.","The canto ends with the end of the Yadu dynasty and Krishna's return to His own abode."],
      hi:["संसार छोड़ने से पहले श्रीकृष्ण अपने प्रिय मित्र उद्धव को अंतिम उपदेश देते हैं, जिसे उद्धव गीता कहते हैं। इसमें एक अवधूत की कथा है जिसने प्रकृति के चौबीस गुरुओं से सीखा।","स्कंध यदुवंश के अंत और श्रीकृष्ण के अपने धाम लौटने के साथ समाप्त होता है।"]},
 themes:{en:["Krishna's final teachings","Learning from nature"],hi:["श्रीकृष्ण के अंतिम उपदेश","प्रकृति से सीखना"]},
 eps:[["11.6–29","The Uddhava Gītā","उद्धव गीता"]]},
{n:12,en:"The Age of Deterioration",hi:"पतन का युग",chapters:13,
 sum:{en:["Śukadeva describes the future kings and the signs of the age of Kali, and the coming of Lord Kalki at its end. King Parīkṣit, fearless and peaceful, leaves his body as Takṣaka arrives.","The canto ends with the story of the sage Mārkaṇḍeya and a summary of the whole Bhāgavatam, praising the chanting of the Lord's names."],
      hi:["शुकदेव जी भविष्य के राजाओं और कलियुग के लक्षणों, तथा उसके अंत में भगवान कल्कि के आगमन का वर्णन करते हैं। निर्भय और शांत राजा परीक्षित तक्षक के आने पर देह त्याग देते हैं।","स्कंध मार्कण्डेय ऋषि की कथा और पूरी भागवत के सार के साथ समाप्त होता है, जो भगवान के नाम-जप की महिमा गाता है।"]},
 themes:{en:["Signs of Kali-yuga","A peaceful end","The holy name"],hi:["कलियुग के लक्षण","शांत अंत","पवित्र नाम"]},
 eps:[["12.1–6","The Age of Kali and the Passing of Parīkṣit","कलियुग और परीक्षित का देहांत"]]}

function renderHome(){
  const C=CANTOS[cantoSel-1];
  $('cantoBar').innerHTML=CANTOS.map(c=>`<button type="button" class="cb" role="radio" aria-checked="${c.n===cantoSel}" data-canto="${c.n}"><span class="num">${c.n}</span><span class="nm">${c[lang]}</span>${c.n===1?`<span class="dotlive">● ${t('ready1')}</span>`:''}</button>`).join('');
  { const bar=$('cantoBar'), btn=bar.querySelector('[aria-checked="true"]'); if(btn) requestAnimationFrame(()=>{ bar.scrollLeft=btn.offsetLeft-bar.offsetLeft-bar.clientWidth/2+btn.clientWidth/2; }); }
  $('cantoTagEl').textContent=`${t('cantoW')} ${C.n} · ${C.chapters} ${t('chapW')}`;
  $('cantoNameEl').textContent=`${t('cantoLbl')} ${C.n}: ${C[lang]}`;
  const sum=C.n===1?CANTO[lang].sum:C.sum[lang], th=C.n===1?CANTO[lang].themes:C.themes[lang];
  $('sumText').innerHTML=sum.map(p=>`<p>${p}</p>`).join('');
  $('themes').innerHTML=th.map(x=>`<span>${x}</span>`).join('');
  const has=C.n===1; $('vidBox').hidden=!has; $('vidSoon').hidden=has;
  // in-page slideshow: dispatch langchange so player updates captions
  if(has) document.dispatchEvent(new Event('langchange'));
  if(has){
    $('eps').innerHTML=EPS.map((e,i)=>`<li><button type="button" class="ep ep-btn" data-ep="${i}"><span class="n">${i+1}</span><span class="thumb">${artOf(e.scenes[0])}</span><span><b>${e[lang]}</b><small>SB ${e.ref} · ${t('scenesMeta',{n:e.scenes.length})}</small></span><span class="play" aria-hidden="true">▶</span></button></li>`).join('');
  } else {
    $('eps').innerHTML=C.eps.map((e,i)=>`<li class="ep soon-row"><span class="n">${i+1}</span><span><b>${lang==='hi'?e[2]:e[1]}</b><small>SB ${e[0]}</small></span><span class="soon">${t('epsSoon')}</span></li>`).join('');
  }
}
function pickCanto(n,fromHash){
  n=Math.min(12,Math.max(1,n|0)); if(n===cantoSel&&fromHash) return;
  cantoSel=n; if(!fromHash){ try{ history.replaceState(null,'','#canto-'+n);}catch(e){ location.hash='canto-'+n; } }
  renderHome();
}

/* More scene art for Canto 1 episodes */
function sc(top,bot,gy,gc,body,o={}){const k=sky(top,bot);return svgWrap(k.def,`<rect width="400" height="300" fill="${k.fill}"/>${o.stars?stars(o.stars,gy):''}${o.sun?`<circle class="pulse" cx="${o.sun[0]}" cy="${o.sun[1]}" r="${o.sun[2]||28}" fill="${o.sun[3]||'#fff3c4'}"/>`:''}${o.moon?`<circle cx="${o.moon[0]}" cy="${o.moon[1]}" r="18" fill="#f4f0d6"/>`:''}<rect y="${gy}" width="400" height="${300-gy}" fill="${gc}"/>${body}`);}
function raysAt(x,y,n=14,len=110,op=.3){return `<g class="rays" style="transform-origin:${x}px ${y}px">${Array.from({length:n},(_,i)=>`<rect x="${x-2}" y="${y-len}" width="4" height="${len}" fill="#fff6d6" opacity="${op}" transform="rotate(${i*360/n} ${x} ${y})"/>`).join('')}</g>`;}
function sage(x,y,s=.8,o={}){return person(x,y,s,Object.assign({sit:1,cloth:'#e9c46a',beard:'#ddd',hair:'#888',topknot:1,arm:'fold'},o));}
function boy(x,y,s=.7,o={}){return person(x,y,s,Object.assign({cloth:'#f4a261',topknot:1,arm:'down'},o));}
function vyasa(x,y,s=1.05,o={}){return person(x,y,s,Object.assign({sit:1,cloth:'#f1faee',beard:'#ddd',hair:'#888',topknot:1,arm:'lap',tilak:1},o));}
function narada(x,y,s=1,o={}){return person(x,y,s,Object.assign({cloth:'#ffb347',topknot:1,arm:'fold',tilak:1,mala:1,halo:'#fff6c8'},o))+vina(x,y-35*s,s);}
function king(x,y,s=.95,c='#1f6fb3',o={}){return person(x,y,s,Object.assign({cloth:c,crown:'#f2c14e',arm:'fold'},o));}
function lady(x,y,s=.95,c='#d6336c',o={}){return person(x,y,s,Object.assign({cloth:c,arm:'fold',hair:'#120a05'},o));}
function tent(x,y,s=1,c='#c9a46a'){return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-34,0 L0,-46 L34,0Z" fill="${c}"/><path d="M-6,0 L0,-20 L6,0Z" fill="#3a2414"/><line x1="0" y1="-46" x2="0" y2="-58" stroke="#6b4a1a" stroke-width="2"/><path d="M0,-58 L12,-54 L0,-50Z" fill="#ef8a3c"/></g>`;}
function mountains(gy,c1='#7d8fb3',c2='#e9eef7'){return `<path d="M0,${gy} L60,${gy-90} L110,${gy-40} L170,${gy-120} L240,${gy-50} L300,${gy-110} L360,${gy-60} L400,${gy-80} L400,${gy}Z" fill="${c1}"/><path d="M150,${gy-95} L170,${gy-120} L190,${gy-96} L178,${gy-100} L170,${gy-92} L160,${gy-100}Z" fill="${c2}"/><path d="M285,${gy-90} L300,${gy-110} L315,${gy-90} L305,${gy-94} L300,${gy-88} L292,${gy-94}Z" fill="${c2}"/>`;}
function emojiOrb(x,y,e,r=20,delay=0){return `<g transform="translate(${x} ${y})"><g class="float" style="animation-delay:${delay}s"><circle r="${r}" fill="#fff6d6" opacity=".9"/><circle r="${r}" fill="none" stroke="#f2c14e" stroke-width="2"/><text y="${r*0.38}" text-anchor="middle" font-size="${r*1.1}">${e}</text></g></g>`;}
function fireball(x,y,s=1,cls='pulse'){return `<g transform="translate(${x} ${y}) scale(${s})"><circle class="${cls}" r="16" fill="#ffb347" opacity=".5"/><circle r="9" fill="#ff7a1a"/><circle r="4" fill="#fff3b0"/></g>`;}
function banyan(x,y,s=1){return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-8" y="-60" width="16" height="60" fill="#5a3a22"/>${[-30,-12,12,30].map(d=>`<line x1="${d}" y1="-50" x2="${d}" y2="0" stroke="#5a3a22" stroke-width="2"/>`).join('')}<g class="sway"><ellipse cx="0" cy="-74" rx="62" ry="30" fill="#2b5d34"/><ellipse cx="-30" cy="-60" rx="30" ry="18" fill="#2f6b3a"/><ellipse cx="32" cy="-60" rx="30" ry="18" fill="#2f6b3a"/></g></g>`;}
function cows(x,y,s=.7){return cow(x,y,s).replace(/class="tear"/g,'class="tear" style="display:none"');}
function bookGlow(x,y,s=1){return `<g transform="translate(${x} ${y}) scale(${s})"><circle class="pulse" r="40" fill="#fff3b0" opacity=".5"/><g class="float"><rect x="-26" y="-18" width="52" height="34" rx="3" fill="#fff8e6"/><line x1="0" y1="-18" x2="0" y2="16" stroke="#c9a46a"/><path d="M-20,-8 h14 M-20,-2 h14 M-20,4 h12 M6,-8 h14 M6,-2 h14 M6,4 h12" stroke="#c9a46a" stroke-width="1.2"/></g></g>`;}
function conch(x,y,s=1){return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M0,0 C-14,-4 -18,-18 -6,-24 C6,-28 16,-16 12,-6 Z" fill="#fffaf0" stroke="#d8c9a3"/><path d="M-6,-24 c4,4 8,6 14,6" stroke="#d8c9a3" fill="none"/>${[0,1,2].map(i=>`<path class="pulse" style="animation-delay:${i*.6}s" d="M${18+i*10},-14 q6,8 0,16" stroke="#fff" stroke-width="2" fill="none" opacity=".7"/>`).join('')}</g>`;}
function wheel(x,y,r=22){return `<g transform="translate(${x} ${y})"><circle r="${r}" fill="none" stroke="#6b4a1a" stroke-width="4"/><g class="spin">${[0,45,90,135].map(a=>`<line x1="-${r}" y1="0" x2="${r}" y2="0" stroke="#6b4a1a" stroke-width="2" transform="rotate(${a})"/>`).join('')}</g></g>`;}
function jackal(x,y,s=1){return `<g transform="translate(${x} ${y}) scale(${s})"><ellipse cx="0" cy="-14" rx="16" ry="7" fill="#b08a5a"/><path d="M14,-18 l12,-10 l2,8 Z" fill="#b08a5a"/><path d="M20,-26 l2,-8 l3,7Z" fill="#b08a5a"/>${[-10,-4,6,12].map(i=>`<rect x="${i}" y="-9" width="2.5" height="9" fill="#b08a5a"/>`).join('')}<path d="M-16,-14 q-10,0 -12,8" stroke="#b08a5a" stroke-width="3" fill="none"/></g>`;}

  hi:["सेवा करने वाला बालक","फिर नारद जी ने अपनी कथा सुनाई। पिछले जन्म में वे एक दासी के पुत्र थे। एक बार वर्षा ऋतु में कुछ महान ऋषि पास में ठहरे। उस छोटे बालक ने उनकी सेवा की, उनका बचा हुआ प्रसाद खाया, और हर दिन उनसे श्रीकृष्ण की कथाएँ सुनीं।"]},

  hi:["भगवान की एक झलक","एक बरगद के पेड़ के नीचे बैठकर उसने ऋषियों के सिखाए अनुसार ध्यान किया। अचानक भगवान उसके हृदय में प्रकट हुए, फिर ओझल हो गए। एक कोमल वाणी ने कहा: इस जीवन में तुम मुझे फिर नहीं देखोगे, पर यह तड़प तुम्हारे प्रेम को बढ़ाएगी।"]},
 {art:'naradaSings',en:["Nārada the Singer","In his next life he became Nārada, who travels everywhere singing the Lord's names on his vīṇā. Inspired by him, Vyāsadeva meditated and wrote the Śrīmad-Bhāgavatam."],
  hi:["गायक नारद","अगले जन्म में वे नारद बने, जो अपनी वीणा पर भगवान के नाम गाते हुए सब जगह घूमते हैं। उनसे प्रेरणा पाकर व्यासदेव ने ध्यान किया और श्रीमद्भागवतम् की रचना की।"]}],
 lessons:{en:["Without remembering God, even great success can feel empty.","Serving good people and hearing from them can change a whole life.","Even a loss can be a turning point toward God.","Longing for the Lord makes our love for Him grow."],
  hi:["भगवान को याद किए बिना बड़ी सफलता भी खाली लग सकती है।","सज्जनों की सेवा और उनसे सुनना पूरा जीवन बदल सकता है।","एक दुख भी भगवान की ओर मुड़ने का अवसर बन सकता है।","भगवान के लिए तड़प उनके प्रति प्रेम को बढ़ाती है।"]},
 quiz:[
 {a:1,en:["Why did Vyāsadeva feel empty?",["He was hungry","He had not fully described the Lord's glories","He had lost his books","Nobody read his works"],"Nārada said only describing the Lord's glories can satisfy the heart."],hi:["व्यासदेव को खालीपन क्यों लगा?",["उन्हें भूख लगी थी","उन्होंने भगवान की महिमा का पूरा वर्णन नहीं किया था","उनकी पुस्तकें खो गई थीं","कोई उनकी रचनाएँ नहीं पढ़ता था"],"नारद जी ने कहा कि केवल भगवान की महिमा का वर्णन ही हृदय को संतुष्ट कर सकता है।"]},
 {a:2,en:["Who was Nārada in his past life?",["A king","A hunter","The son of a maidservant","A deer"],"He was a maidservant's son who served the sages during the rainy season."],hi:["पिछले जन्म में नारद जी कौन थे?",["एक राजा","एक शिकारी","एक दासी के पुत्र","एक हिरण"],"वे एक दासी के पुत्र थे, जिन्होंने वर्षा ऋतु में ऋषियों की सेवा की।"]},
 {a:0,en:["What instrument does Nārada play?",["Vīṇā","Flute","Drum","Conch"],"Nārada travels everywhere singing the Lord's names on his vīṇā."],hi:["नारद जी कौन-सा वाद्य बजाते हैं?",["वीणा","बाँसुरी","ढोल","शंख"],"नारद जी अपनी वीणा पर भगवान के नाम गाते हुए सब जगह घूमते हैं।"]}]},

{ref:"1.7",en:"Aśvatthāmā Punished, Draupadī's Mercy",hi:"अश्वत्थामा को दंड, द्रौपदी की दया",
 scenes:[
 {art:'camp',en:["A Cruel Night","At the end of the Kurukṣetra war, Aśvatthāmā, the son of the teacher Droṇa, crept into the Pāṇḍava camp at night. To please Duryodhana, he killed the five sleeping sons of Draupadī."],
  hi:["एक क्रूर रात","कुरुक्षेत्र युद्ध के अंत में आचार्य द्रोण का पुत्र अश्वत्थामा रात में चुपके से पांडवों के शिविर में घुसा। दुर्योधन को प्रसन्न करने के लिए उसने द्रौपदी के पाँच सोते हुए पुत्रों को मार डाला।"]},
 {art:'grief',en:["Draupadī Weeps","Draupadī wept with a broken heart. Arjuna comforted her and promised to bring the killer to her."],
  hi:["द्रौपदी का विलाप","द्रौपदी टूटे हृदय से रोने लगीं। अर्जुन ने उन्हें सांत्वना दी और हत्यारे को उनके सामने लाने का वचन दिया।"]},
 {art:'weapons',en:["Two Great Weapons","Aśvatthāmā fled and fired the brahmāstra, a weapon of terrible fire. On Krishna's advice, Arjuna fired his own to stop it. When the two fires threatened the whole world, Arjuna withdrew them both."],
  hi:["दो महान अस्त्र","अश्वत्थामा भागा और उसने भयानक अग्नि वाला ब्रह्मास्त्र चला दिया। श्रीकृष्ण की सलाह पर अर्जुन ने उसे रोकने के लिए अपना ब्रह्मास्त्र चलाया। जब दोनों अग्नियाँ पूरे संसार के लिए खतरा बनीं, तो अर्जुन ने दोनों को वापस ले लिया।"]},
 {art:'bound',en:["Brought Before Draupadī","Arjuna captured Aśvatthāmā, tied him with ropes, and brought him before Draupadī, as he had promised."],
  hi:["द्रौपदी के सामने","अर्जुन ने अश्वत्थामा को पकड़ लिया, रस्सियों से बाँधा, और वचन के अनुसार द्रौपदी के सामने ले आए।"]},
 {art:'mercy',en:["Draupadī's Mercy","Though grieving, Draupadī said: release him. He is the son of our teacher Droṇa. Do not make his mother weep the way I am weeping."],
  hi:["द्रौपदी की दया","दुखी होते हुए भी द्रौपदी ने कहा: इसे छोड़ दो। यह हमारे गुरु द्रोण का पुत्र है। इसकी माँ को वैसे मत रुलाओ जैसे मैं रो रही हूँ।"]},
 {art:'jewel',en:["A Wise Solution","Some wanted him killed, others wanted him freed. Krishna smiled and gave a wise solution. Arjuna cut off Aśvatthāmā's hair and took the jewel from his head. For him, this dishonour was like death, and his life was spared."],
  hi:["एक बुद्धिमान समाधान","कुछ लोग उसे मारना चाहते थे, कुछ छोड़ना। श्रीकृष्ण मुस्कुराए और एक बुद्धिमान उपाय बताया। अर्जुन ने अश्वत्थामा के केश काट दिए और उसके मस्तक की मणि ले ली। उसके लिए यह अपमान मृत्यु के समान था, और उसके प्राण बच गए।"]}],
 lessons:{en:["Draupadī forgave even in great pain. Mercy is a sign of a great heart.","She thought of another mother's feelings before her own anger.","When there is a hard choice, ask the Lord for guidance, as Arjuna asked Krishna.","Power must be used with control, as Arjuna withdrew the weapons."],
  hi:["द्रौपदी ने बड़े दुख में भी क्षमा किया। दया महान हृदय का लक्षण है।","उन्होंने अपने क्रोध से पहले दूसरी माँ की भावनाओं के बारे में सोचा।","कठिन निर्णय में भगवान से मार्गदर्शन माँगें, जैसे अर्जुन ने श्रीकृष्ण से माँगा।","शक्ति का प्रयोग संयम से होना चाहिए, जैसे अर्जुन ने अस्त्र वापस लिए।"]},
 cross:{en:["Finding it hard to forgive someone?","Open Krishna's Life Compass for simple steps from the Gītā."],hi:["किसी को क्षमा करना कठिन लग रहा है?","गीता से आसान उपायों के लिए Krishna's Life Compass खोलें।"]},
 quiz:[
 {a:1,en:["Whose son was Aśvatthāmā?",["Bhīṣma","Droṇa","Vidura","Duryodhana"],"Aśvatthāmā was the son of Droṇa, the Pāṇḍavas' teacher."],hi:["अश्वत्थामा किसका पुत्र था?",["भीष्म","द्रोण","विदुर","दुर्योधन"],"अश्वत्थामा पांडवों के गुरु द्रोण का पुत्र था।"]},
 {a:2,en:["What did Draupadī ask Arjuna to do?",["Kill him at once","Send him to prison","Release him","Make him a servant"],"She asked that he be released, so his mother would not weep as she did."],hi:["द्रौपदी ने अर्जुन से क्या करने को कहा?",["उसे तुरंत मार दो","उसे कारागार भेज दो","उसे छोड़ दो","उसे सेवक बना लो"],"उन्होंने उसे छोड़ने को कहा, ताकि उसकी माँ उनकी तरह न रोए।"]},
 {a:0,en:["What did Arjuna take from Aśvatthāmā's head?",["A jewel","A crown","A flower","A feather"],"Arjuna cut his hair and took the jewel from his head."],hi:["अर्जुन ने अश्वत्थामा के मस्तक से क्या लिया?",["मणि","मुकुट","फूल","पंख"],"अर्जुन ने उसके केश काटे और मस्तक की मणि ले ली।"]}]},

{ref:"1.8",en:"Queen Kuntī's Prayers",hi:"रानी कुंती की प्रार्थनाएँ",
 scenes:[
 {art:'funeral',en:["By the Gaṅgā","After the war, the Pāṇḍavas offered water by the Gaṅgā for the relatives who had died. Krishna comforted them and got ready to leave for Dvārakā."],
  hi:["गंगा के किनारे","युद्ध के बाद पांडवों ने गंगा के किनारे मृत संबंधियों के लिए जल अर्पित किया। श्रीकृष्ण ने उन्हें सांत्वना दी और द्वारका जाने की तैयारी की।"]},
 {art:'womb',en:["Saved in the Womb","Just then Uttarā ran to Krishna, crying: a burning weapon is chasing me! It was Aśvatthāmā's brahmāstra, aimed at her unborn child. Krishna entered her womb and protected the baby Parīkṣit with His own power."],
  hi:["गर्भ में रक्षा","तभी उत्तरा रोती हुई श्रीकृष्ण के पास दौड़ी: एक जलता हुआ अस्त्र मेरा पीछा कर रहा है! वह अश्वत्थामा का ब्रह्मास्त्र था, जो उसके अजन्मे शिशु पर चलाया गया था। श्रीकृष्ण ने उसके गर्भ में प्रवेश कर अपनी शक्ति से शिशु परीक्षित की रक्षा की।"]},
 {art:'actor',en:["Kuntī Begins to Pray","Queen Kuntī, Krishna's aunt, folded her hands and prayed: You are everywhere, yet hidden from ordinary eyes, like an actor in costume whom the audience does not recognise."],
  hi:["कुंती की प्रार्थना","श्रीकृष्ण की बुआ रानी कुंती ने हाथ जोड़कर प्रार्थना की: आप सब जगह हैं, फिर भी साधारण आँखों से छिपे हैं, जैसे वेश बदले अभिनेता को दर्शक नहीं पहचानते।"]},
 {art:'memories',en:["You Always Saved Us","She remembered: You saved us from poisoned food, from the burning house of lac, from the insult in the dice game, and from great warriors in battle. Again and again You protected us."],
  hi:["आपने सदा हमारी रक्षा की","उन्होंने याद किया: आपने हमें विष भरे भोजन से, लाख के जलते महल से, जुए के खेल के अपमान से, और युद्ध में महान योद्धाओं से बचाया। बार-बार आपने हमारी रक्षा की।"]},
 {art:'calamity',en:["Let Troubles Come","Then she made a surprising prayer: let troubles come to us again and again, because in trouble we remember You, and seeing You, we are free from fear of birth and death."],
  hi:["विपत्तियाँ आएँ","फिर उन्होंने एक अनोखी प्रार्थना की: हम पर बार-बार विपत्तियाँ आएँ, क्योंकि विपत्ति में हम आपको याद करते हैं, और आपके दर्शन से जन्म-मृत्यु का भय मिट जाता है।"]},
 {art:'smile',en:["Krishna Smiles","Krishna smiled at her pure prayers and agreed to stay a little longer. But King Yudhiṣṭhira was still grieving for the war, so they went to see the great Bhīṣma."],
  hi:["श्रीकृष्ण की मुस्कान","उनकी शुद्ध प्रार्थना सुनकर श्रीकृष्ण मुस्कुराए और कुछ समय और रुकने को मान गए। पर राजा युधिष्ठिर अब भी युद्ध के कारण दुखी थे, इसलिए सब महान भीष्म से मिलने गए।"]}],
 lessons:{en:["God protects us even when we cannot see Him.","Remember the times you were helped. Gratitude makes faith strong.","Hard times can bring us closer to God.","Pray for love of God, not only for comforts."],
  hi:["भगवान हमारी रक्षा करते हैं, तब भी जब हम उन्हें देख नहीं पाते।","उन समयों को याद करें जब आपकी सहायता हुई। कृतज्ञता विश्वास को मज़बूत करती है।","कठिन समय हमें भगवान के और करीब ला सकता है।","केवल सुख-सुविधा के लिए नहीं, भगवान के प्रेम के लिए प्रार्थना करें।"]},
 cross:{en:["Going through a hard time?","Open Krishna's Life Compass for simple steps from the Gītā."],hi:["क्या आप कठिन समय से गुज़र रहे हैं?","गीता से आसान उपायों के लिए Krishna's Life Compass खोलें।"]},
 quiz:[
 {a:2,en:["Who did Krishna protect inside Uttarā's womb?",["Arjuna","Bhīma","Parīkṣit","Abhimanyu"],"Krishna protected the unborn Parīkṣit from the brahmāstra."],hi:["श्रीकृष्ण ने उत्तरा के गर्भ में किसकी रक्षा की?",["अर्जुन","भीम","परीक्षित","अभिमन्यु"],"श्रीकृष्ण ने अजन्मे परीक्षित की ब्रह्मास्त्र से रक्षा की।"]},
 {a:1,en:["What did Kuntī surprisingly pray for?",["Gold and jewels","More troubles, so she would always remember Krishna","A bigger kingdom","A long holiday"],"She asked for troubles, because in trouble she remembered Krishna."],hi:["कुंती ने कौन-सी अनोखी प्रार्थना की?",["सोना और गहने","और विपत्तियाँ, ताकि वे सदा श्रीकृष्ण को याद रखें","बड़ा राज्य","लंबी छुट्टी"],"उन्होंने विपत्तियाँ माँगीं, क्योंकि विपत्ति में वे श्रीकृष्ण को याद करती थीं।"]},
 {a:3,en:["Kuntī compared Krishna to what?",["A king on a throne","A bird in the sky","A river","An actor in costume"],"Like an actor in costume, He is present but not recognised by ordinary eyes."],hi:["कुंती ने श्रीकृष्ण की तुलना किससे की?",["सिंहासन पर राजा","आकाश में पक्षी","नदी","वेश बदले अभिनेता"],"वेश बदले अभिनेता की तरह, वे उपस्थित हैं पर साधारण आँखें उन्हें नहीं पहचानतीं।"]}]},

{ref:"1.9",en:"Bhīṣma on the Bed of Arrows",hi:"बाणों की शय्या पर भीष्म",
 scenes:[
 {art:'gather',en:["At Kurukṣetra","The Pāṇḍavas, with Krishna, went to the battlefield of Kurukṣetra. There the great grandfather Bhīṣma lay on a bed of arrows, waiting for the right time to leave his body. Great sages came to see him too."],
  hi:["कुरुक्षेत्र में","पांडव श्रीकृष्ण के साथ कुरुक्षेत्र के युद्धक्षेत्र में गए। वहाँ महान पितामह भीष्म बाणों की शय्या पर लेटे थे, देह त्यागने के सही समय की प्रतीक्षा में। महान ऋषि भी उनसे मिलने आए।"]},
 {art:'gather',en:["Don't Blame Yourselves","Bhīṣma told the Pāṇḍavas: your sufferings came by the force of time and the Lord's plan, which no one fully understands. Do not blame yourselves. Rule the people well."],
  hi:["स्वयं को दोष मत दो","भीष्म ने पांडवों से कहा: तुम्हारे कष्ट काल की शक्ति और भगवान की योजना से आए, जिसे कोई पूरी तरह नहीं समझता। स्वयं को दोष मत दो। प्रजा का अच्छे से पालन करो।"]},
 {art:'teach',en:["Lessons on Duty","Then he taught Yudhiṣṭhira about duties: of kings, of families, of those who renounce the world, of women, and of devotees of the Lord."],
  hi:["कर्तव्य की शिक्षा","फिर उन्होंने युधिष्ठिर को कर्तव्यों की शिक्षा दी: राजाओं के, परिवारों के, संसार त्यागने वालों के, स्त्रियों के, और भगवान के भक्तों के।"]},
 {art:'wheelPromise',en:["Krishna Broke His Promise","Bhīṣma remembered how, in battle, Krishna had promised not to take up weapons. Yet to keep Bhīṣma's own vow true, Krishna jumped down and rushed at him holding a chariot wheel. Bhīṣma loved that memory."],
  hi:["श्रीकृष्ण ने अपना वचन तोड़ा","भीष्म को याद आया कि युद्ध में श्रीकृष्ण ने शस्त्र न उठाने का वचन दिया था। फिर भी भीष्म का अपना प्रण सच करने के लिए श्रीकृष्ण रथ से कूदे और रथ का पहिया लेकर उनकी ओर दौड़े। भीष्म को यह स्मृति बहुत प्रिय थी।"]},
 {art:'gaze',en:["Eyes on Krishna","When the auspicious time arrived, Bhīṣma fixed his eyes on Krishna standing before him, and offered beautiful prayers with all his heart."],
  hi:["दृष्टि श्रीकृष्ण पर","जब शुभ समय आया, भीष्म ने सामने खड़े श्रीकृष्ण पर अपनी दृष्टि टिका दी, और पूरे हृदय से सुंदर स्तुति की।"]},
 {art:'farewell',en:["A Peaceful Farewell","Gazing at Krishna, Bhīṣma peacefully left his body. Flowers fell from the sky, and everyone honoured the great devotee."],
  hi:["शांत विदाई","श्रीकृष्ण को निहारते हुए भीष्म ने शांति से देह त्याग दी। आकाश से फूल बरसे, और सबने उस महान भक्त का सम्मान किया।"]}],
 lessons:{en:["Some things happen by time and God's plan. Don't drown in guilt.","Elders carry deep wisdom. Listen to them.","Krishna cares more for His devotee than for His own promise.","Remembering God at the end makes a life complete."],
  hi:["कुछ बातें काल और भगवान की योजना से होती हैं। अपराध-बोध में मत डूबो।","बड़ों के पास गहरा ज्ञान होता है। उनकी बात सुनो।","श्रीकृष्ण को अपने वचन से अधिक अपने भक्त की परवाह है।","अंत समय में भगवान का स्मरण जीवन को पूर्ण बनाता है।"]},
 quiz:[
 {a:2,en:["Where was Bhīṣma lying?",["On a golden throne","On a bed of flowers","On a bed of arrows","In a palace"],"Bhīṣma lay on a bed of arrows on the battlefield of Kurukṣetra."],hi:["भीष्म कहाँ लेटे थे?",["सोने के सिंहासन पर","फूलों की शय्या पर","बाणों की शय्या पर","महल में"],"भीष्म कुरुक्षेत्र के युद्धक्षेत्र में बाणों की शय्या पर लेटे थे।"]},
 {a:0,en:["What did Krishna hold when He rushed at Bhīṣma?",["A chariot wheel","A flute","A sword","A lotus"],"To keep Bhīṣma's vow true, Krishna rushed at him holding a chariot wheel."],hi:["भीष्म की ओर दौड़ते समय श्रीकृष्ण के हाथ में क्या था?",["रथ का पहिया","बाँसुरी","तलवार","कमल"],"भीष्म का प्रण सच करने के लिए श्रीकृष्ण रथ का पहिया लेकर दौड़े।"]},
 {a:1,en:["What was Bhīṣma looking at when he left his body?",["The sky","Krishna","His bow","The river"],"He fixed his eyes on Krishna and left his body peacefully."],hi:["देह त्यागते समय भीष्म किसे देख रहे थे?",["आकाश को","श्रीकृष्ण को","अपने धनुष को","नदी को"],"उन्होंने श्रीकृष्ण पर दृष्टि टिकाई और शांति से देह त्याग दी।"]}]},

{ref:"1.10–11",en:"Krishna Returns to Dvārakā",hi:"श्रीकृष्ण की द्वारका वापसी",
 scenes:[
 {art:'kingdom',en:["A Happy Kingdom","With Krishna's blessings, Yudhiṣṭhira ruled the world with justice. Rains came on time, the earth gave plenty, and the cows gave so much milk that the pastures were wet with it."],
  hi:["सुखी राज्य","श्रीकृष्ण के आशीर्वाद से युधिष्ठिर ने न्याय से संसार पर राज्य किया। समय पर वर्षा हुई, धरती ने भरपूर अन्न दिया, और गायों ने इतना दूध दिया कि चरागाह भीग गए।"]},
 {art:'leaving',en:["A Tearful Goodbye","When Krishna left Hastināpura for Dvārakā, the Pāṇḍavas walked a long way with Him, unable to say goodbye. The ladies of the city watched from the rooftops and spoke lovingly of Him."],
  hi:["आँसुओं भरी विदाई","जब श्रीकृष्ण हस्तिनापुर से द्वारका के लिए चले, तो पांडव विदा न कह पाने के कारण बहुत दूर तक उनके साथ चले। नगर की स्त्रियाँ छतों से उन्हें देखती रहीं और प्रेम से उनकी बातें करती रहीं।"]},
 {art:'arrive',en:["The Conch Sounds","As Krishna reached Dvārakā, He blew His conch, the Pāñcajanya. Hearing that sound, the whole city knew: our Lord is home!"],
  hi:["शंखनाद","द्वारका पहुँचकर श्रीकृष्ण ने अपना पाञ्चजन्य शंख बजाया। वह ध्वनि सुनकर पूरे नगर ने जान लिया: हमारे प्रभु घर आ गए!"]},
 {art:'welcome',en:["A Grand Welcome","The citizens rushed out with gifts, music, flags and flowers. Like children greeting their father, they said: please stay with us, without You we feel lost."],
  hi:["भव्य स्वागत","नगरवासी उपहार, संगीत, ध्वज और फूल लेकर दौड़ पड़े। जैसे बच्चे पिता का स्वागत करते हैं, उन्होंने कहा: कृपया हमारे साथ रहिए, आपके बिना हम खो जाते हैं।"]},
 {art:'mothers',en:["Mothers First","In the palace, Krishna first went to His mothers, led by Devakī, and bowed to them. They held Him close, with tears of joy."],
  hi:["पहले माताएँ","महल में श्रीकृष्ण सबसे पहले देवकी सहित अपनी माताओं के पास गए और उन्हें प्रणाम किया। उन्होंने आनंद के आँसुओं के साथ उन्हें गले लगा लिया।"]},
 {art:'palaces',en:["Always New","Then He went to His queens. Though they saw Him every day, Krishna always seemed new and wonderful to them. Yet in the middle of it all, He was never attached."],
  hi:["सदा नवीन","फिर वे अपनी रानियों के पास गए। यद्यपि वे उन्हें हर दिन देखती थीं, श्रीकृष्ण उन्हें सदा नए और अद्भुत लगते थे। फिर भी इन सबके बीच वे कभी आसक्त नहीं हुए।"]}],
 lessons:{en:["A good ruler brings happiness to people, animals and nature.","Love makes goodbyes hard, and welcomes joyful.","Respect your parents first, as Krishna bowed to His mothers.","Enjoy life's blessings without becoming attached to them."],
  hi:["अच्छा शासक लोगों, पशुओं और प्रकृति, सबके लिए सुख लाता है।","प्रेम विदाई को कठिन और स्वागत को आनंदमय बनाता है।","माता-पिता का पहले सम्मान करें, जैसे श्रीकृष्ण ने माताओं को प्रणाम किया।","जीवन के सुखों का आनंद लें, पर उनमें आसक्त न हों।"]},
 quiz:[
 {a:3,en:["What is the name of Krishna's conch?",["Devadatta","Gāṇḍīva","Sudarśana","Pāñcajanya"],"Krishna blew His conch, the Pāñcajanya, on reaching Dvārakā."],hi:["श्रीकृष्ण के शंख का नाम क्या है?",["देवदत्त","गांडीव","सुदर्शन","पाञ्चजन्य"],"द्वारका पहुँचकर श्रीकृष्ण ने अपना पाञ्चजन्य शंख बजाया।"]},
 {a:1,en:["Whom did Krishna meet first in the palace?",["His friends","His mothers","His queens","His soldiers"],"He first went to His mothers, led by Devakī, and bowed to them."],hi:["महल में श्रीकृष्ण सबसे पहले किससे मिले?",["अपने मित्रों से","अपनी माताओं से","अपनी रानियों से","अपने सैनिकों से"],"वे सबसे पहले देवकी सहित अपनी माताओं के पास गए और उन्हें प्रणाम किया।"]},
 {a:0,en:["Who ruled the world with justice?",["Yudhiṣṭhira","Duryodhana","Kaṁsa","Dhṛtarāṣṭra"],"With Krishna's blessings, Yudhiṣṭhira ruled with justice."],hi:["किसने न्याय से संसार पर राज्य किया?",["युधिष्ठिर","दुर्योधन","कंस","धृतराष्ट्र"],"श्रीकृष्ण के आशीर्वाद से युधिष्ठिर ने न्याय से राज्य किया।"]}]},

{ref:"1.13",en:"Vidura Wakes Up Dhṛtarāṣṭra",hi:"विदुर जी ने धृतराष्ट्र को जगाया",
 scenes:[
 {art:'viduraArrives',en:["Vidura Returns","Vidura, the wise uncle of the Pāṇḍavas, returned to Hastināpura after a long pilgrimage. The whole family welcomed him with great joy."],
  hi:["विदुर जी की वापसी","पांडवों के ज्ञानी चाचा विदुर एक लंबी तीर्थयात्रा के बाद हस्तिनापुर लौटे। पूरे परिवार ने बड़े आनंद से उनका स्वागत किया।"]},
 {art:'silence',en:["Kind Silence","On his travels Vidura had heard that Krishna's family, the Yadu dynasty, had come to an end. But he kept this sad news to himself, so as not to hurt the Pāṇḍavas."],
  hi:["दयालु मौन","यात्रा में विदुर ने सुना था कि श्रीकृष्ण का यदुवंश समाप्त हो चुका है। पर पांडवों को दुख न पहुँचे, इसलिए उन्होंने यह दुखद समाचार अपने मन में ही रखा।"]},
 {art:'warn',en:["Strong Words","Then Vidura spoke frankly to his elder brother Dhṛtarāṣṭra: you are old and blind, and you are living on the charity of the very Pāṇḍavas you tried to destroy. Is this how you want to live?"],
  hi:["सीधे शब्द","फिर विदुर ने अपने बड़े भाई धृतराष्ट्र से साफ़ कहा: आप वृद्ध और अंधे हैं, और उन्हीं पांडवों की कृपा पर जी रहे हैं जिन्हें आपने नष्ट करना चाहा था। क्या आप ऐसे ही जीना चाहते हैं?"]},
 {art:'time',en:["Time Takes All","Vidura said: time is taking everything away, your sons, your strength, your health. No one can stop it. Leave home now, and turn your mind to God."],
  hi:["काल सब ले जाता है","विदुर ने कहा: काल सब कुछ छीन रहा है, आपके पुत्र, आपकी शक्ति, आपका स्वास्थ्य। इसे कोई नहीं रोक सकता। अभी घर छोड़िए, और अपना मन भगवान में लगाइए।"]},
 {art:'nightWalk',en:["Leaving at Night","Dhṛtarāṣṭra's heart finally woke up. That night he quietly left the palace with his faithful wife Gāndhārī and went toward the Himalayas."],
  hi:["रात में प्रस्थान","आख़िरकार धृतराष्ट्र का हृदय जाग उठा। उसी रात वे अपनी पतिव्रता पत्नी गांधारी के साथ चुपचाप महल छोड़कर हिमालय की ओर चले गए।"]},
 {art:'naradaComforts',en:["Nārada Comforts the King","In the morning Yudhiṣṭhira was very worried. Nārada arrived and comforted him: everyone is under the Lord's control. Your uncle has gone to find peace. Do not grieve."],
  hi:["नारद जी ने राजा को सांत्वना दी","सुबह युधिष्ठिर बहुत चिंतित हुए। नारद जी आए और उन्हें सांत्वना दी: सब भगवान के नियंत्रण में हैं। तुम्हारे चाचा शांति खोजने गए हैं। दुखी मत हो।"]}],
 lessons:{en:["Sometimes kindness means waiting to share sad news.","A true well-wisher tells us the truth, even if it is hard to hear.","Time moves on for everyone, so don't delay what really matters.","It is never too late to turn to God."],
  hi:["कभी-कभी दया का अर्थ है दुखद समाचार देने में धैर्य रखना।","सच्चा हितैषी हमें सच बताता है, चाहे वह सुनने में कठिन हो।","समय सबके लिए आगे बढ़ता है, इसलिए जो सच में महत्वपूर्ण है उसमें देर मत करो।","भगवान की ओर मुड़ने में कभी देर नहीं होती।"]},
 quiz:[
 {a:1,en:["What news did Vidura keep to himself?",["A new king was born","The end of Krishna's Yadu dynasty","A war had started","He had found treasure"],"He did not share the sad news, so as not to hurt the Pāṇḍavas."],hi:["विदुर ने कौन-सा समाचार अपने मन में रखा?",["एक नए राजा का जन्म","श्रीकृष्ण के यदुवंश का अंत","एक युद्ध शुरू हुआ","उन्हें खज़ाना मिला"],"पांडवों को दुख न पहुँचे, इसलिए उन्होंने यह दुखद समाचार नहीं बताया।"]},
 {a:2,en:["Who left with Dhṛtarāṣṭra?",["Kuntī","Draupadī","Gāndhārī","Uttarā"],"His faithful wife Gāndhārī went with him toward the Himalayas."],hi:["धृतराष्ट्र के साथ कौन गया?",["कुंती","द्रौपदी","गांधारी","उत्तरा"],"उनकी पतिव्रता पत्नी गांधारी उनके साथ हिमालय की ओर गईं।"]},
 {a:0,en:["What did Vidura say is taking everything away?",["Time","Enemies","Thieves","Floods"],"Vidura said time is taking everything, and no one can stop it."],hi:["विदुर के अनुसार सब कुछ कौन छीन रहा है?",["काल (समय)","शत्रु","चोर","बाढ़"],"विदुर ने कहा कि काल सब कुछ छीन रहा है, और इसे कोई नहीं रोक सकता।"]}]},

{ref:"1.14–15",en:"Krishna Departs, the Pāṇḍavas Retire",hi:"श्रीकृष्ण का प्रस्थान, पांडवों का वनगमन",
 scenes:[
 {art:'omens',en:["Bad Signs","Arjuna had gone to Dvārakā and had not come back for months. Yudhiṣṭhira saw bad omens everywhere: jackals howled, cows wept, and the seasons went wrong. He grew very anxious."],
  hi:["अशुभ संकेत","अर्जुन द्वारका गए थे और महीनों से नहीं लौटे थे। युधिष्ठिर को हर जगह अशुभ संकेत दिखने लगे: सियार चिल्लाते, गायें रोतीं, और ऋतुएँ बिगड़ गईं। वे बहुत चिंतित हो गए।"]},
 {art:'arjunaReturns',en:["Arjuna Returns","At last Arjuna returned, pale and in tears. With great difficulty he said: my dear brother, Krishna, our friend and protector, has left this world."],
  hi:["अर्जुन की वापसी","आख़िरकार अर्जुन लौटे, पीले चेहरे और आँसुओं के साथ। बड़ी कठिनाई से उन्होंने कहा: भैया, हमारे मित्र और रक्षक श्रीकृष्ण इस संसार से चले गए।"]},
 {art:'remember',en:["Precious Memories","Arjuna remembered everything: how Krishna helped him win Draupadī, saved them in danger, drove his chariot in battle, and joked with him like a true friend."],
  hi:["अनमोल यादें","अर्जुन को सब याद आया: कैसे श्रीकृष्ण ने उन्हें द्रौपदी को जीतने में सहायता की, संकट में बचाया, युद्ध में उनका रथ चलाया, और सच्चे मित्र की तरह उनसे हँसी-मज़ाक किया।"]},
 {art:'robbed',en:["All Strength Gone","On the way back, ordinary cowherd robbers attacked, and Arjuna, the greatest archer, could not stop them. He understood: all his power had really been Krishna's power."],
  hi:["सारी शक्ति चली गई","लौटते समय साधारण ग्वाले लुटेरों ने हमला किया, और सबसे महान धनुर्धर अर्जुन उन्हें रोक नहीं पाए। वे समझ गए: उनकी सारी शक्ति वास्तव में श्रीकृष्ण की ही शक्ति थी।"]},
 {art:'gita',en:["Peace from the Gītā","Then Arjuna remembered the teachings Krishna had given him in the Bhagavad-gītā. His grief melted away and his mind became peaceful."],
  hi:["गीता से शांति","तब अर्जुन को भगवद्गीता में श्रीकृष्ण द्वारा दिए गए उपदेश याद आए। उनका दुख पिघल गया और मन शांत हो गया।"]},
 {art:'himalaya',en:["The Last Journey","Seeing that the age of Kali had begun, Yudhiṣṭhira crowned his grandson Parīkṣit as king. Then the five Pāṇḍavas and Draupadī left everything and walked north, with their minds fixed on Krishna."],
  hi:["अंतिम यात्रा","कलियुग का आरंभ देखकर युधिष्ठिर ने अपने पोते परीक्षित का राज्याभिषेक किया। फिर पाँचों पांडव और द्रौपदी सब कुछ छोड़कर, मन श्रीकृष्ण में लगाए, उत्तर दिशा की ओर चल पड़े।"]}],
 lessons:{en:["Our strength and talents are gifts from God. Stay humble.","When we lose someone dear, their words and memories can guide us.","The Gītā gives peace in the hardest moments.","Know when to let go, and hand over responsibility well."],
  hi:["हमारी शक्ति और प्रतिभा भगवान का उपहार हैं। विनम्र रहें।","जब कोई प्रिय चला जाए, तो उसकी बातें और यादें हमारा मार्गदर्शन करती हैं।","गीता सबसे कठिन क्षणों में भी शांति देती है।","कब छोड़ना है यह जानें, और ज़िम्मेदारी अच्छे से सौंपें।"]},

/* ---------- State ---------- */
const $=id=>document.getElementById(id);
const store={get(k,d){try{return localStorage.getItem(k)||d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang=store.get('bs-lang','en');
let idx=0, playing=true, voiceOn=true, musicOn=false, auto=true, timer=null, audioCtx=null, drone=null, token=0, started=false;
const t=(k,vars)=>{let s=UI[lang][k];if(vars)for(const v in vars)s=s.replace('{'+v+'}',vars[v]);return s;};

function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));
  $('lang').innerHTML=`<span aria-hidden="true">🌐</span> ${lang==='en'?'हिं':'EN'}`;
  $('lang').setAttribute('aria-label',lang==='en'?'हिन्दी में देखें (View in Hindi)':'View in English (अंग्रेज़ी में देखें)');
  renderHome(); voiceCheck();
  if(!$('player').hidden) render();
  if(!$('end').hidden){renderLessons();showQ();}
}
$('lang').onclick=()=>{lang=lang==='en'?'hi':'en';store.set('bs-lang',lang);stopSpeech();applyLang();};

/* ---------- Voice (fixed): sentence-by-sentence, language-aware, with clear fallbacks ---------- */
const synth=('speechSynthesis' in window && 'SpeechSynthesisUtterance' in window)?window.speechSynthesis:null;
function voices(){try{return synth?synth.getVoices():[]}catch(e){return[]}}
function pickVoice(){
  const v=voices(); if(!v.length) return null;
  if(lang==='hi') return v.find(x=>/^hi/i.test(x.lang))||null;
  return v.find(x=>/en[-_]IN/i.test(x.lang))||v.find(x=>/en[-_]GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null;
}
function voiceCheck(){
  const el=$('vstatus'); el.hidden=false; el.classList.remove('warn');
  if(!synth){el.textContent=t('vNone');el.classList.add('warn');return;}
  const v=voices();
  if(!v.length){el.hidden=true;return;} // voices still loading; re-checked on voiceschanged
  const p=pickVoice();
  if(p){el.textContent=t('vOk',{v:p.name});}
  else{el.textContent=t('vNoLang');el.classList.add('warn');}
}
if(synth){ synth.onvoiceschanged=voiceCheck; setTimeout(voiceCheck,800); setTimeout(()=>{if(!voices().length){const el=$('vstatus');el.hidden=false;el.classList.add('warn');el.textContent=t('vNone');}},3000); }

function sentences(text){return text.match(/[^.!?।]+[.!?।]+['’"]?|[^.!?।]+$/g).map(s=>s.trim()).filter(Boolean);}
function clearT(){clearTimeout(timer);timer=null;}
function stopSpeech(){token++;clearT();if(synth){try{synth.cancel()}catch(e){}}}
function scheduleNext(ms){clearT(); if(playing&&auto) timer=setTimeout(next,ms);}
function readingTime(){return Math.max(8000,CUR().scenes[idx][lang][1].split(/\s+/).length*420);}

function speak(fromTap){
  stopSpeech(); $('pstatus').hidden=true;
  if(!playing) return;
  if(!voiceOn || !synth){ scheduleNext(readingTime()); if(voiceOn&&!synth){$('pstatus').textContent=t('vNone');$('pstatus').hidden=false;} return; }
  const my=token, parts=[...document.querySelectorAll('#ctext .s')], v=pickVoice();
  let i=0, gotStart=false;
  const say=()=>{
    if(my!==token) return;
    parts.forEach((p,k)=>p.classList.toggle('on',k===i));
    if(i>=parts.length){parts.forEach(p=>p.classList.remove('on'));scheduleNext(1200);return;}
    const u=new SpeechSynthesisUtterance(parts[i].textContent.replace(/['‘’]/g,''));
    u.lang=lang==='hi'?'hi-IN':'en-IN'; if(v) u.voice=v; u.rate=lang==='hi'?0.9:0.92;
    u.onstart=()=>{gotStart=true;$('tapVoice').style.display='none';};
    u.onend=()=>{if(my!==token)return;i++;setTimeout(say,150);};
    u.onerror=e=>{if(my!==token||e.error==='interrupted'||e.error==='canceled')return;showBlocked();};
    try{synth.resume();synth.speak(u);}catch(e){showBlocked();}
  };
  // Chrome drops speech if speak() follows cancel() too quickly
  setTimeout(say,fromTap?0:120);
  setTimeout(()=>{if(my===token && !gotStart) showBlocked();},3500);
}
function showBlocked(){
  if(!$('pstatus').hidden) return;
  $('tapVoice').style.display='flex';
  $('pstatus').textContent=t('vBlocked'); $('pstatus').hidden=false;
  scheduleNext(readingTime());
}
$('tapVoice').onclick=()=>{playing=true;$('play').textContent='⏸';speak(true);};

/* ---------- Player ---------- */
function render(){
  const s=CUR().scenes[idx][lang];
  $('epHead').innerHTML=`${t('epN',{n:epIdx+1,t:EPS.length})}<b>${CUR()[lang]}</b>`;
  $('stage').innerHTML=`<div class="scene-in" style="width:100%;height:100%">${artOf(CUR().scenes[idx])}</div><span class="scene-num">${t('scene')} ${idx+1} / ${CUR().scenes.length}</span>`;
  $('cap').innerHTML=`<div class="fade"><h3 class="serif">${s[0]}</h3><p id="ctext">${sentences(s[1]).map(x=>`<span class="s">${x}</span>`).join(' ')}</p></div>`;
  $('dots').innerHTML=CUR().scenes.map((_,i)=>`<button type="button" class="dot${i===idx?' on':i<idx?' done':''}" data-i="${i}" aria-label="${t('scene')} ${i+1}"></button>`).join('');
  $('tapVoice').style.display='none';
  speak();
}
function next(){ if(idx<CUR().scenes.length-1){idx++;render();} else finish(); }
function prev(){ if(idx>0){idx--;render();} }
function show(id){['home','player','end'].forEach(x=>$(x).hidden=x!==id);window.scrollTo({top:0,behavior:'smooth'});}
function start(e){if(typeof e==='number')epIdx=e;show('player');idx=0;playing=true;$('play').textContent='⏸';if(musicOn)startDrone();render();}
function finish(){stopSpeech();stopDrone();show('end');renderLessons();qi=0;score=0;showQ();}
function renderEnd(){
  const c=CUR().cross; $('crossCard').hidden=!c; if(c){$('crossT').textContent=c[lang][0];$('crossS').textContent=c[lang][1];}
  if(epIdx<EPS.length-1){const n=EPS[epIdx+1];$('nextEp').innerHTML=`<span>${t('nextUp')}:</span> <b>${n[lang]}</b><button class="btn" id="goNext" type="button">▶ ${t('nextUp')}</button>`;$('goNext').onclick=()=>start(epIdx+1);}
  else $('nextEp').innerHTML=`<span>${t('nextLbl')}</span> <b>${t('nextEp')}</b>`;
}

$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'⏸':'▶';if(playing)speak(true);else stopSpeech();};
$('next').onclick=next; $('prev').onclick=prev;
$('dots').onclick=e=>{const i=e.target.dataset.i;if(i!==undefined){idx=+i;render();}};
$('tVoice').onclick=e=>{voiceOn=!voiceOn;e.currentTarget.classList.toggle('on',voiceOn);speak(true);};
$('tMusic').onclick=e=>{musicOn=!musicOn;e.currentTarget.classList.toggle('on',musicOn);musicOn?startDrone():stopDrone();};
$('tAuto').onclick=e=>{auto=!auto;e.currentTarget.classList.toggle('on',auto);if(!auto)clearT();};
$('home2').onclick=()=>{stopSpeech();stopDrone();show('home');};

function vShowSlide(i){
  vSlideIdx=i;
  const lines=VNAR[lang]; const total=lines.length;
  $(‘sumArt’).style.background=VBG[i]||’var(--surface-2)’;
  $(‘sumArt’).innerHTML=VICON[i]||’’;
  $(‘sumCap’).textContent=lines[i]||’’;
  $(‘sumProg’).style.width=((i+1)/total*100)+’%’;
}

function vSpeakSlide(i){
  if(!vNarr||!synth) return;
  const text=VNAR[lang][i]; if(!text) return;
  try{synth.cancel();}catch(e){}
  const u=new SpeechSynthesisUtterance(text.replace(/[‘’’]/g,’’));
  u.lang=lang===’hi’?’hi-IN’:’en-IN’; const v=pickVoice(); if(v)u.voice=v; u.rate=lang===’hi’?0.95:0.92;
  synth.speak(u);
}

function vAdvance(tok){
  if(tok!==vSlideTok||!vSlidePlaying) return;
  const next=vSlideIdx+1;
  if(next>=VNAR[lang].length){ vStop(); return; }
  vShowSlide(next); vSpeakSlide(next);
  const dur=VDUR[next]||7;
  vSlideTimer=setTimeout(()=>vAdvance(tok), dur*1000);
}

function vPlay(){
  vSlidePlaying=true; const tok=++vSlideTok;
  $(‘sumOverlay’).style.display=’none’;
  $(‘sumToggles’).hidden=false;
  vShowSlide(0); vSpeakSlide(0);
  const dur=VDUR[0]||4.5;
  vSlideTimer=setTimeout(()=>vAdvance(tok), dur*1000);
}

function vStop(){
  vSlidePlaying=false; vSlideTok++;
  clearTimeout(vSlideTimer);
  if(synth)try{synth.cancel();}catch(e){}
  $(‘sumProg’).style.width=’100%’;
}

$(‘sumSlide’).onclick=()=>{ if(!vSlidePlaying) vPlay(); };
$(‘sumOverlay’).onclick=()=>{ if(!vSlidePlaying) vPlay(); };

$(‘tVidNarr’).onclick=e=>{
  vNarr=!vNarr; e.currentTarget.classList.toggle(‘on’,vNarr);
  if(!vNarr&&synth)try{synth.cancel();}catch(e){}
  if(vNarr&&vSlidePlaying) vSpeakSlide(vSlideIdx);
  if(!synth&&vNarr){ $(‘vnstatus’).textContent=t(‘vidNoVoice’); $(‘vnstatus’).hidden=false; }
};

// Language switch: restart speech for current slide if playing
document.addEventListener(‘langchange’,()=>{
  if(vSlidePlaying){ vShowSlide(vSlideIdx); vSpeakSlide(vSlideIdx); }
  // also update overlay title
  document.querySelectorAll(‘#sumOverlay [data-t="vidTitle"]’).forEach(el=>el.textContent=t(‘vidTitle’));
});

/* Tanpura-like drone */
function startDrone(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();const g=audioCtx.createGain();g.gain.value=0;g.connect(audioCtx.destination);const oscs=[110,165,220,110.6].map(f=>{const o=audioCtx.createOscillator();o.type='sawtooth';o.frequency.value=f;const lp=audioCtx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=700;o.connect(lp);lp.connect(g);o.start();return o;});g.gain.linearRampToValueAtTime(0.035,audioCtx.currentTime+2);drone={g,oscs};}catch(e){}}
function stopDrone(){if(drone&&audioCtx){const d=drone;d.g.gain.linearRampToValueAtTime(0,audioCtx.currentTime+1);setTimeout(()=>d.oscs.forEach(o=>{try{o.stop()}catch(e){}}),1100);drone=null;}}

function renderLessons(){renderEnd();$('lessons').innerHTML=CUR().lessons[lang].map(l=>`<li>${l}</li>`).join('');}
let qi=0,score=0;
function showQ(){
  const box=$('quiz');
  const QZ=CUR().quiz;
  if(qi>=QZ.length){
    const msg=score===QZ.length?t('s5'):score>=Math.ceil(QZ.length*.6)?t('s3'):t('s0');
    box.innerHTML=`<h2 class="sec">${t('done')}</h2><div class="score"><b>${score} / ${QZ.length}</b>${msg}</div><button class="btn" id="retry" type="button">${t('retry')}</button>`;
    $('retry').onclick=()=>{qi=0;score=0;showQ();};return;
  }
  const Q=QZ[qi], q=Q[lang];
  box.innerHTML=`<h2 class="sec">${t('quiz')}</h2><div class="qcount">${t('qOf',{n:qi+1,t:QZ.length})}</div><div class="qtext">${q[0]}</div>${q[1].map((o,i)=>`<button type="button" class="opt" data-i="${i}">${o}</button>`).join('')}<div id="ex"></div>`;
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;box.querySelectorAll('.opt').forEach(x=>x.disabled=true);
    box.querySelectorAll('.opt')[Q.a].classList.add('right');
    if(i===Q.a)score++;else b.classList.add('wrong');
    $('ex').innerHTML=`<p class="explain">${i===Q.a?t('correct'):t('notQuite')}${q[2]}</p><button class="btn" id="nq" type="button">${qi===QZ.length-1?t('seeScore'):t('nextQ')}</button>`;
    $('nq').onclick=()=>{qi++;showQ();};
  });
}
