<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;color:#f4f7ff;background:#08214f}
.frame{position:absolute;inset:0;background:radial-gradient(110% 60% at 80% 5%,rgba(80,160,255,.45) 0%,transparent 55%),radial-gradient(90% 50% at 10% 95%,rgba(255,211,77,.22) 0%,transparent 60%),linear-gradient(170deg,#123c8c 0%,#08214f 75%)}
.top{position:absolute;top:90px;left:70px;right:70px;display:flex;align-items:center;gap:18px;font-weight:800;font-size:40px;color:#ffe38a}
.top svg{width:84px;height:54px;color:#ffd34d}
.top .c{margin-left:auto;font-size:30px;color:#c8d6f2;font-weight:700}
.art{position:absolute;top:200px;left:50px;width:980px;height:735px;border-radius:44px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 0 3px rgba(255,211,77,.35)}
.art svg{width:100%;height:100%;display:block}
.txt{position:absolute;top:1040px;left:70px;right:70px}
.ref{display:inline-block;font-size:30px;font-weight:800;letter-spacing:.06em;color:#0b2a6b;background:#ffd34d;border-radius:999px;padding:6px 22px}
h1{font-family:'DejaVu Serif',serif;font-size:84px;line-height:1.1;color:#ffd34d;margin-top:26px;text-shadow:0 0 40px rgba(255,211,77,.45)}
p{font-size:52px;line-height:1.45;margin-top:30px;color:#e8eefc}
.bar{position:absolute;bottom:150px;left:70px;right:70px;height:10px;border-radius:5px;background:rgba(255,255,255,.15);overflow:hidden}
.bar i{display:block;height:100%;background:#ffd34d}
.by{position:absolute;bottom:80px;left:0;right:0;text-align:center;font-size:30px;color:#c8d6f2;font-weight:700}
.fade{position:absolute;inset:0;background:#08214f;pointer-events:none}
/* title/end */
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:80px}
.center .lotus{width:300px;height:190px;color:#ffd34d;filter:drop-shadow(0 0 30px rgba(255,211,77,.6))}
.center h1{font-size:110px;margin-top:40px}
.center h2{font-family:'DejaVu Serif',serif;font-size:56px;color:#ffe38a;margin-top:10px}
.center p{font-size:50px;max-width:900px}
.center .tag{font-size:36px;color:#c8d6f2;margin-top:50px;font-weight:700}
/* entrances */
.in1{animation:up 1s ease .3s both}.in2{animation:up 1s ease .8s both}.in3{animation:fadein 1.2s ease 1.3s both}
@keyframes up{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.grow{animation:grow 2.2s ease both;transform-origin:center}@keyframes grow{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
/* scene animations */
.kenburns{animation:kb 9s ease-in-out both;transform-origin:50% 60%}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.1) translate(-6px,-4px)}}
.twinkle{animation:tw 3s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.pulse{animation:pu 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:.9;transform:scale(1.12)}}
.float{animation:fl 4s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.sway{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.flow{animation:flw 6s linear infinite}@keyframes flw{from{transform:translateX(0)}to{transform:translateX(-80px)}}
.tear{animation:tr 2s ease-in infinite}@keyframes tr{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(18px);opacity:0}}
.bounce-off{animation:bo 2.4s ease-out infinite}@keyframes bo{0%{transform:translate(0,0);opacity:1}100%{transform:translate(60px,-50px);opacity:0}}
.bounce-off2{animation:bo2 2.4s ease-out infinite .8s}@keyframes bo2{0%{transform:translate(0,0);opacity:1}100%{transform:translate(-60px,-40px);opacity:0}}
.walk{animation:wk 5s ease-out both}@keyframes wk{from{transform:translateX(120px);opacity:0}to{transform:translateX(0);opacity:1}}
.walkL{animation:wkl 6s ease-out both}@keyframes wkl{from{transform:translateX(-160px)}to{transform:translateX(0)}}
.rays{animation:ry 12s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes ry{to{transform:rotate(360deg)}}
.spin{animation:ry 1.2s linear infinite;transform-box:fill-box;transform-origin:center}
.breathe{animation:br 4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}@keyframes br{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.02)}}
.glowred{animation:gr 1.6s ease-in-out infinite}@keyframes gr{0%,100%{opacity:.3}50%{opacity:.8}}
.flicker{animation:fk .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom center}@keyframes fk{from{transform:scaleY(.85)}to{transform:scaleY(1.12)}}
.petal{animation:pf 5s linear infinite}@keyframes pf{from{transform:translateY(-40px) rotate(0)}to{transform:translateY(320px) rotate(300deg)}}
.rise{animation:rs 7s ease-in both}@keyframes rs{from{transform:translateY(0);opacity:1}to{transform:translateY(-70px);opacity:.25}}
.rock{animation:rk 2.5s ease-in-out infinite;transform-box:fill-box;transform-origin:top center}@keyframes rk{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.write{animation:wr 1.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:left center}@keyframes wr{from{transform:rotate(-8deg)}to{transform:rotate(6deg)}}
</style></head>

function krishna(x,y,s,arm='up',extra={}){
  // blue form, yellow cloth, crown and peacock feather
  const hy=extra.sit?-46:-62;
  return `<g transform="translate(${x} ${y}) scale(${s})">${person(0,0,1,Object.assign({skin:'#3a6fd0',cloth:'#f2c14e',crown:'#f2c14e',arm,halo:'#bfe6ff',mala:1},extra))}
  <g transform="translate(6 ${hy-18}) rotate(20)"><path d="M0,0 C-6,-8 -4,-20 0,-24 C4,-20 6,-8 0,0Z" fill="#2a8a6a"/><ellipse cx="0" cy="-15" rx="3" ry="4" fill="#1f4fa8"/><circle cx="0" cy="-15" r="1.4" fill="#e8b923"/></g></g>`;
}
function vina(x,y,s=1){return `<g transform="translate(${x} ${y}) scale(${s}) rotate(-30)"><line x1="-30" y1="0" x2="30" y2="0" stroke="#8b5a2b" stroke-width="4"/><circle cx="-30" cy="4" r="9" fill="#c98f5a"/><circle cx="30" cy="4" r="9" fill="#c98f5a"/><line x1="-28" y1="-2" x2="28" y2="-2" stroke="#f4e3b0" stroke-width=".8"/></g>`;}
function chariot(x,y,s=1,flip=0){return `<g transform="translate(${x} ${y}) scale(${flip?-s:s} ${s})"><path d="M-40,-30 L40,-30 L34,0 L-34,0Z" fill="#c9a032"/><path d="M-40,-30 L-46,-56 L-30,-34Z" fill="#e2b83c"/><line x1="30" y1="-30" x2="30" y2="-95" stroke="#6b4a1a" stroke-width="2.5"/><path d="M30,-95 L58,-88 L30,-80Z" fill="#ef8a3c" class="sway"/><g transform="translate(-10 4)"><circle r="18" fill="none" stroke="#6b4a1a" stroke-width="4"/><g class="spin">${[0,45,90,135].map(a=>`<line x1="-18" y1="0" x2="18" y2="0" stroke="#6b4a1a" stroke-width="2" transform="rotate(${a})"/>`).join('')}</g></g></g>`;}
function petals(n){let s='';for(let i=0;i<n;i++){const x=(i*53+20)%400;s+=`<g transform="translate(${x} 0)"><ellipse class="petal" style="animation-delay:-${(i*0.7)%5}s;animation-duration:${4+i%3}s" cx="0" cy="0" rx="4" ry="2.5" fill="${['#ff8fab','#ffd34d','#ff9f43','#fff'][i%4]}"/></g>`;}return s;}
function arrowsBed(x,y){let s=`<rect x="${x-80}" y="${y-6}" width="160" height="6" fill="#6b4a1a"/>`;for(let i=0;i<22;i++){const ax=x-78+i*7.4;s+=`<line x1="${ax}" y1="${y}" x2="${ax+(i%2?3:-3)}" y2="${y+40}" stroke="#7a5a2a" stroke-width="1.6"/><path d="M${ax-2},${y+40} l2,6 l2,-6Z" fill="#999"/>`;}return s;}

  const HT=["जंगल में प्रश्न", "नारद जी का मार्गदर्शन", "द्रौपदी की दया", "रानी कुंती की प्रार्थना", "भीष्म की विदाई", "द्वारका में स्वागत", "परीक्षित का जन्म", "विदुर की चेतावनी", "श्रीकृष्ण का प्रस्थान", "परीक्षित ने कलि को रोका", "सात दिन"], HP=["नैमिषारण्य वन में हज़ारों ऋषि सूत गोस्वामी से पूछते हैं: कलियुग में लोगों के लिए सबसे उत्तम क्या है?", "व्यासदेव ने वेद और महाभारत लिखे, फिर भी उनका मन खाली है। नारद जी कहते हैं, भगवान की लीलाओं का वर्णन करो। तब व्यास जी भागवत लिखते हैं।", "अश्वत्थामा द्रौपदी के सोते हुए पुत्रों को मार देता है। अर्जुन उसे पकड़ लाते हैं, पर दुखी द्रौपदी उसे छोड़ देने को कहती हैं।", "श्रीकृष्ण गर्भ में परीक्षित की एक घातक अस्त्र से रक्षा करते हैं। कुंती प्रार्थना करती हैं: विपत्तियाँ फिर आएँ, ताकि मैं सदा आपको याद रखूँ।", "बाणों की शय्या पर लेटे भीष्म पांडवों को उपदेश देते हैं, फिर श्रीकृष्ण का मुस्कुराता मुख देखते हुए देह त्याग देते हैं।", "श्रीकृष्ण आँसुओं के बीच हस्तिनापुर से विदा लेते हैं, और द्वारका संगीत, फूलों और आनंद से उनका स्वागत करती है।", "शिशु परीक्षित का जन्म होता है, और वह हर चेहरे में उस तेजस्वी भगवान को खोजता है जिन्होंने गर्भ में उसकी रक्षा की थी।", "बुद्धिमान विदुर अपने अंधे, वृद्ध भाई धृतराष्ट्र से कहते हैं: समय सब कुछ छीन रहा है, घर छोड़ो और भगवान की ओर मुड़ो।", "श्रीकृष्ण इस संसार से प्रस्थान करते हैं और अर्जुन का हृदय टूट जाता है। पांडव परीक्षित का राज्याभिषेक कर अंतिम यात्रा पर निकलते हैं।", "राजा परीक्षित कलि को एक बैल और गाय, यानी धर्म और धरती माता, को पीटते देखते हैं। वे कलि को छोड़ देते हैं, पर उसके रहने के स्थान सीमित कर देते हैं।", "सात दिन में मृत्यु का श्राप पाकर परीक्षित गंगा तट पर बैठते हैं और पूछते हैं कि मृत्यु से पहले क्या करना चाहिए। उत्तर देने शुकदेव जी पधारते हैं।"];
  for(let i=1;i<=11;i++){S[i].t=HT[i-1];S[i].p=HP[i-1];S[i].ref=S[i].ref.replace('SB','भा.');}
  window.HI=1;
  const st=document.createElement('style');st.textContent="body,h1,h2,p,.tag,.top,.by,.ref{font-family:'FreeSans',sans-serif!important} h1{font-weight:700} p{font-size:48px!important;line-height:1.5!important}";document.head.appendChild(st);
}
const TOTAL=S.reduce((a,b)=>a+b.dur,0);
const LOTUS=`<svg class="lotus" viewBox="0 0 64 40"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M32 6c6 7 8 16 0 30-8-14-6-23 0-30Z"/><path d="M32 36c-4-9-11-16-22-18 2 10 10 17 22 18Z"/><path d="M32 36c4-9 11-16 22-18-2 10-10 17-22 18Z"/><path d="M32 36C24 31 12 30 4 32c8 5 18 6 28 4Z"/><path d="M32 36c8-5 20-6 28-4-8 5-18 6-28 4Z"/></g></svg>`;
let cur;
function show(i){
  cur=i; const s=S[i]; const before=S.slice(0,i).reduce((a,b)=>a+b.dur,0);
  let h=`<div class="frame"></div>`;
  if(s.type==='title'){
    h+=`<div class="frame" style="opacity:.9"><svg viewBox="0 0 400 700" style="width:100%;height:100%">${stars(70,700)}</svg></div>
    <div class="center"><div class="grow">${LOTUS}</div><h2 class="in1">${window.HI?'श्रीमद्भागवतम्':'Śrīmad-Bhāgavatam'}</h2><h1 class="in2">${window.HI?'प्रथम स्कंध':'Canto 1'}</h1><h2 class="in2">${window.HI?'सृष्टि':'Creation'}</h2><div class="tag in3">${window.HI?'भागवत के आरंभ की कथा':'The story of how the Bhāgavatam began'}</div></div>`;
  } else if(s.type==='end'){
    h+=`<div class="frame" style="opacity:.9"><svg viewBox="0 0 400 700" style="width:100%;height:100%">${stars(70,700)}</svg></div>
    <div class="center"><div class="grow">${LOTUS}</div><p class="in1" style="font-family:'DejaVu Serif',serif;font-size:62px;color:#ffd34d">${window.HI?'शेष भागवत इसी प्रश्न का उत्तर है।':'The rest of the Bhāgavatam is the answer.'}</p><div class="tag in2">${window.HI?'आगे: द्वितीय स्कंध':'Next: Canto 2'}</div><div class="tag in3" style="margin-top:120px;color:#ffe38a">${window.HI?'भागवत कथाएँ<br>हेमलता भारद्वाज द्वारा निर्मित':'Bhāgavatam Stories<br>Created by Hemalatha Bharadwaj'}</div></div>`;
  } else {
    let art=typeof s.art==='number'?SVG[s.art]():NEW[s.art]();if(window.HI)art=art.replace('>Bhāgavatam<','>भागवत<');
    h+=`<div class="top">${LOTUS.replace('class="lotus"','')}<span>${window.HI?'भागवत कथाएँ':'Bhāgavatam Stories'}</span><span class="c">${window.HI?'स्कंध 1':'Canto 1'}</span></div>
    <div class="art">${art}</div>
    <div class="txt"><span class="ref in1">${s.ref}</span><h1 class="in1">${s.t}</h1><p class="in2">${s.p}</p></div>
    <div class="by">${window.HI?'हेमलता भारद्वाज द्वारा निर्मित':'Created by Hemalatha Bharadwaj'}</div>`;
  }
  h+=`<div class="bar"><i id="prog"></i></div><div class="fade" id="fd"></div>`;
  document.getElementById('root').innerHTML=h;
  window._before=before;
  document.getAnimations().forEach(a=>a.pause());
}
function setTime(t){
  const s=S[cur];
  document.getAnimations().forEach(a=>{a.currentTime=t*1000;});
  const fi=0.45, fo=0.45; let o=0;
  if(t<fi)o=1-t/fi; else if(t>s.dur-fo)o=(t-(s.dur-fo))/fo;
  if(cur===0&&t<fi)o=1-t/fi; if(cur===S.length-1&&t>s.dur-1.2)o=(t-(s.dur-1.2))/1.2;
  document.getElementById('fd').style.opacity=Math.max(0,Math.min(1,o));
  document.getElementById('prog').style.width=((window._before+t)/TOTAL*100)+'%';
}
window.S=S;
</script></body></html>
